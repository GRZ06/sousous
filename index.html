:root {
  --bg: #0D0D0D;
  --card: #111A14;
  --card-2: #18231C;
  --line: rgba(255, 255, 255, .07);
  --line-2: rgba(255, 255, 255, .13);
  --pine: #0B3D1F;
  --pine-3: #1A6B3A;
  --accent: #52C784;
  --text: #F2F5F3;
  --muted: #9AA49E;
  --faint: #848E88;
  --good: #43C576;
  --warn: #F2B33D;
  --crit: #F05A5A;
  --danger: #D93A3F;
  --fixed: #9085E9;
  --c-var: #36A866;
  --f-display: 'SS Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --f-text: 'SS Text', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --f-mono: 'SS Mono', ui-monospace, Menlo, Consolas, monospace;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --nav: 60px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: dark; background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; background: transparent; color: var(--text);
  font: 400 15px/1.45 var(--f-text); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
/* Halo vert sapin en haut d'écran */
body::before {
  content: ''; position: fixed; left: 0; right: 0; top: 0; height: 480px; z-index: -1; pointer-events: none;
  background: radial-gradient(110% 75% at 50% -8%, rgba(11, 61, 31, .95) 0%, rgba(11, 61, 31, .45) 42%, rgba(11, 61, 31, 0) 78%);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { display: block; flex: none; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.mono { font-family: var(--f-mono); font-variant-ligatures: none; }

#app { max-width: 520px; margin: 0 auto; padding: calc(var(--st) + 10px) 16px calc(var(--nav) + var(--sb) + 24px); }
.is-form #app { padding-bottom: calc(var(--sb) + 120px); }

/* ---------- Typo ---------- */
.view-head { display: flex; align-items: center; gap: 8px; min-height: 46px; margin-bottom: 8px; }
.view-title { margin: 0; flex: 1; font: 700 24px/1.15 var(--f-display); letter-spacing: -.025em; }
.view-title:focus { outline: none; }
.form-view .view-title { font-size: 17px; letter-spacing: -.01em; text-align: center; }
.head-spacer { width: 40px; flex: none; }
.h2 { margin: 0; font: 650 16px/1.25 var(--f-display); letter-spacing: -.01em; }
.lab { display: block; font: 700 10.5px/1.3 var(--f-text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.pos { color: var(--accent); }
.neg { color: var(--crit); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 2px 8px; }
.link { color: var(--accent); font-size: 14px; font-weight: 650; text-decoration: none; padding: 6px 0; }

/* ---------- Cartes ---------- */
.card { background: var(--card); border: 1px solid rgba(82, 199, 132, .09); border-radius: 18px; padding: 14px 15px; }
.card + .card { margin-top: 10px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 .card + .card { margin-top: 0; }
.grid2 .wide { grid-column: 1 / -1; }
.stat { display: grid; align-content: start; gap: 4px; min-width: 0; text-decoration: none; color: inherit; padding: 13px 14px; }
.stat .val { font: 700 20px/1.15 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .val.cat { font-size: 17px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
.stat .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Boutons ---------- */
.btn {
  appearance: none; border: 0; border-radius: 13px; min-height: 46px; padding: 0 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 700 15px/1.1 var(--f-text); text-decoration: none;
}
.btn-primary { background: linear-gradient(180deg, #145A31, var(--pine)); color: #fff; box-shadow: inset 0 0 0 1px rgba(82, 199, 132, .38), 0 8px 22px rgba(11, 61, 31, .45); }
.btn-ghost { background: var(--card-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-text { background: none; color: var(--muted); min-height: 42px; font-weight: 650; }
.btn-text.danger { color: var(--crit); }
.btn-block { width: 100%; }
.btn-small { min-height: 32px; padding: 0 11px; font-size: 13px; border-radius: 9px; gap: 6px; }
.icon-btn { appearance: none; border: 0; background: none; color: var(--text); width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.icon-btn:disabled { opacity: .25; }
.icon-btn.round { background: var(--card-2); border-radius: 50%; }

/* ---------- En-tête ---------- */
.top { display: flex; align-items: center; justify-content: space-between; min-height: 46px; }
.brand { display: flex; align-items: center; gap: 9px; margin: 0; font: 700 21px/1 var(--f-display); letter-spacing: -.035em; }
.brand .logo svg { width: 30px; height: 30px; display: block; }
.top-r { display: flex; align-items: center; gap: 2px; }
.date { color: var(--muted); font-size: 13.5px; margin-right: 2px; }
.paste-cta { margin: 6px 0 10px; }
.tx-link.as-btn { appearance: none; border: 0; background: none; width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.month-title { display: grid; justify-items: center; gap: 1px; }
.month-range { font-size: 12px; color: var(--muted); }
.plan-range { display: inline-block; margin-top: 3px; font-size: 12.5px; color: var(--muted); text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .2); text-underline-offset: 3px; }
.select-wrap { position: relative; display: block; min-width: 0; flex: 1; max-width: 220px; }
.select-wrap select { padding-right: 34px; font-size: 15px; }
.sel-chev { position: absolute; right: 12px; top: 50%; transform: translateY(-50%) rotate(90deg); color: var(--faint); pointer-events: none; }
.cyc .cyc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.cyc .btn-text { margin-top: 6px; min-height: 34px; padding: 0 2px; }
.m-field { display: grid; gap: 5px; margin-top: 10px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.m-field .modal-money { margin-top: 0; }
.alert { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(242, 179, 61, .12); color: var(--warn); font-size: 13px; }

/* ---------- Jauge ---------- */
.hero { display: grid; justify-items: center; padding: 0 0 14px; }
.gauge { display: block; width: min(250px, 68vw); border-radius: 50%; }
.gauge-svg { display: block; width: 100%; height: auto; overflow: visible; }
.seg { stroke-width: 8; stroke-linecap: round; }
.st-good .seg { stroke: #123A22; } .st-good .seg.on { stroke: var(--good); }
.st-warn .seg { stroke: #3A2D0F; } .st-warn .seg.on { stroke: var(--warn); }
.st-crit .seg { stroke: #3F1616; } .st-crit .seg.on { stroke: var(--crit); }
.ovr { stroke-width: 3.5; stroke-linecap: round; stroke: #2E1212; } .ovr.on { stroke: var(--crit); }
.g-amt { fill: var(--text); font-family: var(--f-display); font-weight: 700; letter-spacing: -.02em; }
.g-sub { fill: var(--muted); font: 500 15px var(--f-text); }
.g-pct { font: 600 15px var(--f-mono); }
.st-good .g-pct { fill: var(--accent); } .st-warn .g-pct { fill: var(--warn); } .st-crit .g-pct { fill: var(--crit); }
.g-end { fill: var(--faint); font: 500 13px var(--f-mono); }
.status { display: flex; align-items: center; gap: 7px; margin: 0; font: 650 16px/1.3 var(--f-display); letter-spacing: -.01em; }
.status .ic { color: var(--good); }
.status.warn .ic { color: var(--warn); }
.status.crit .ic { color: var(--crit); }
.mode { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; text-align: center; }

/* ---------- Listes ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.card.list { padding: 2px 0; }
.tx { display: flex; align-items: center; }
.tx + .tx { border-top: 1px solid var(--line); }
.tx-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; padding: 10px 4px 10px 13px; color: inherit; text-decoration: none; }
.tx-main { flex: 1; min-width: 0; display: grid; }
.tx-title { font-size: 14.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-amt { font: 600 13.5px var(--f-mono); font-variant-ligatures: none; white-space: nowrap; letter-spacing: -.02em; }
.tx-amt.pos { color: var(--accent); }
.tx-del { appearance: none; border: 0; background: none; color: var(--crit); width: 42px; height: 42px; display: grid; place-items: center; margin-right: 4px; border-radius: 11px; opacity: .8; flex: none; }
.tx-btn { margin-right: 10px; flex: none; }
.tile { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; color: #fff; background: var(--c, #7C827E); }
.tile.big { width: 48px; height: 48px; border-radius: 14px; }
.tag { display: inline-block; padding: 1px 6px; margin-left: 4px; border-radius: 6px; background: rgba(144, 133, 233, .18); color: #C3BBFF; font-size: 10.5px; font-weight: 700; vertical-align: 1px; }
.day-head { display: flex; justify-content: space-between; gap: 12px; margin: 18px 4px 6px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.day-head .mono { font-size: 12px; }
.day-head:first-child { margin-top: 4px; }
.empty { text-align: center; padding: 20px 16px; color: var(--muted); font-size: 14px; }
.empty p { margin: 0 0 12px; }
.capbar { height: 5px; margin-top: 6px; border-radius: 3px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.capbar span { display: block; height: 100%; border-radius: 3px; background: var(--good); }
.capbar.warn span { background: var(--warn); }
.capbar.crit span { background: var(--crit); }

/* ---------- Budget ---------- */
.plan .plan-big { display: block; margin-top: 3px; font: 700 30px/1.1 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.plan-eq { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 14px; }
.plan-eq div { padding: 9px 10px; border-radius: 12px; background: var(--card-2); min-width: 0; }
.plan-eq b { display: block; margin-top: 3px; font: 600 13.5px var(--f-mono); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan-bar { position: relative; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, .07); }
.plan-bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--accent); max-width: 100%; }
.plan-bar.warn .fill { background: var(--warn); }
.plan-bar.crit .fill { background: var(--crit); }
.plan-bar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--text); }
.plan-legend { display: flex; justify-content: space-between; gap: 10px; margin-top: 9px; font-size: 12.5px; color: var(--muted); }
.plan-legend b { color: var(--text); font: 600 12.5px var(--f-mono); }
.plan-pace { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
.subnav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; margin: 14px 0 12px; border-radius: 13px; background: var(--card); border: 1px solid rgba(82, 199, 132, .09); }
.subnav a { display: grid; place-items: center; min-height: 34px; border-radius: 9px; color: var(--muted); font-size: 13px; font-weight: 650; text-decoration: none; }
.subnav a[aria-current="page"] { background: var(--pine); color: #fff; box-shadow: inset 0 0 0 1px rgba(82, 199, 132, .45); }
.total-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 2px 10px; }
.total-line b { font: 700 22px/1.1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.total-line span { color: var(--muted); font-size: 12.5px; }
.list-head { display: flex; justify-content: space-between; margin: 18px 4px 6px; }
.list-head:first-child { margin-top: 2px; }
.add-row { margin-top: 12px; }

/* ---------- Historique ---------- */
.month-bar { display: flex; align-items: center; justify-content: space-between; margin: 0 -6px 10px; }
.search { position: relative; margin: 12px 0 8px; }
.search .input { padding-left: 40px; }
.search .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.chips-row { display: flex; gap: 6px; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px 2px; scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--card-2); color: var(--muted); font-size: 13px; font-weight: 650; text-decoration: none; }
.pill.on { background: var(--pine); color: #fff; box-shadow: inset 0 0 0 1px rgba(82, 199, 132, .45); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }

/* ---------- Formulaires ---------- */
.field { display: grid; gap: 7px; margin: 0 0 15px; border: 0; padding: 0; min-width: 0; }
.flabel { font-size: 12.5px; font-weight: 650; color: var(--muted); padding: 0; }
.input {
  width: 100%; min-height: 46px; border-radius: 13px; border: 1px solid var(--line); background: var(--card-2);
  color: var(--text); padding: 11px 13px; font-size: 16px; line-height: 1.2; -webkit-appearance: none; appearance: none;
}
.input::placeholder { color: var(--faint); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(82, 199, 132, .18); }
input[type="date"].input { display: block; min-width: 0; }
.err { margin: -6px 0 14px; color: var(--crit); font-size: 13px; font-weight: 650; }
.amount-field { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 10px 0 14px; cursor: text; }
.amount-input { flex: 0 1 auto; width: 4.6ch; min-width: 1ch; max-width: calc(100% - 40px); border: 0; background: none; padding: 0; color: var(--text); font: 700 46px/1.1 var(--f-display); letter-spacing: -.035em; text-align: left; }
.amount-input::placeholder { color: #3B433E; }
.amount-input:focus { outline: none; }
.amount-cur { font: 600 28px var(--f-display); color: var(--muted); }
.amount-field:focus-within .amount-cur { color: var(--accent); }
.type-ctl { margin: 0 auto 4px; max-width: 260px; }

.freq { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 4px; margin: -4px -16px 14px; scrollbar-width: none; }
.freq::-webkit-scrollbar { display: none; }
.freq .pill { gap: 6px; }
.freq .pill .mono { font-size: 12px; color: var(--text); }

.ai { display: flex; align-items: center; gap: 9px; min-height: 42px; margin: -5px 0 14px; padding: 5px 7px 5px 12px; border-radius: 12px; background: rgba(11, 61, 31, .45); box-shadow: inset 0 0 0 1px rgba(82, 199, 132, .22); font-size: 13.5px; }
.ai.off { visibility: hidden; }
.ai .ic { color: var(--accent); }
.ai-txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ai-txt b { font-weight: 700; }
.ai-pct { color: var(--muted); margin-left: 6px; font: 500 12px var(--f-mono); }

.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.chip {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
  min-height: 70px; padding: 9px 2px 8px; border: 0; border-radius: 14px;
  background: var(--card); box-shadow: inset 0 0 0 1px var(--line);
  color: var(--muted); font-size: 11px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; text-align: center;
}
.chip .tile { width: 30px; height: 30px; border-radius: 9px; }
.chip.sel { background: var(--pine); color: #fff; box-shadow: inset 0 0 0 2px var(--accent); }
.chip-name { max-width: 100%; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.chip-mark { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0; }
.chip.sugg .chip-mark { opacity: 1; }
.seg-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: 12px; background: var(--card-2); }
.seg-ctl button { min-height: 36px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-size: 13.5px; font-weight: 650; }
.seg-ctl button[aria-checked="true"] { background: var(--pine); color: #fff; box-shadow: inset 0 0 0 1px rgba(82, 199, 132, .45); }
.switch-field span small { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--muted); }
.amount-cap { margin: -8px 0 14px; text-align: center; font-size: 12.5px; color: var(--muted); }
.month-sub { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 0 0 4px; font-size: 13.5px; color: var(--muted); }
.switch-field { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 13px; border-radius: 13px; background: var(--card); border: 1px solid rgba(82, 199, 132, .09); font-size: 14px; font-weight: 600; }
.day-input { width: 90px; text-align: center; font-family: var(--f-mono); }

.form-actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 20px 16px calc(var(--sb) + 12px); background: linear-gradient(to bottom, rgba(13, 13, 13, 0), var(--bg) 30%); }
.form-actions-in { max-width: 488px; margin: 0 auto; display: grid; gap: 2px; }

/* ---------- Catégories ---------- */
.cat-row { display: flex; align-items: center; gap: 10px; padding-right: 13px; }
.cat-row + .cat-row { border-top: 1px solid var(--line); }
.cat-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; padding: 10px 0 10px 13px; color: inherit; text-decoration: none; }
.switch { position: relative; width: 44px; height: 26px; flex: none; border: 0; padding: 0; border-radius: 999px; background: #2A302C; }
.switch span { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #8F9892; transition: transform .16s ease, background .16s ease; }
.switch[aria-checked="true"] { background: var(--pine-3); }
.switch[aria-checked="true"] span { transform: translateX(18px); background: #fff; }
.cat-preview { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
.cat-preview-name { font: 700 20px/1.2 var(--f-display); overflow-wrap: anywhere; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.icon-opt { height: 42px; border: 0; border-radius: 11px; background: var(--card-2); color: var(--muted); display: grid; place-items: center; }
.icon-opt[aria-checked="true"] { background: var(--pine); color: #fff; box-shadow: inset 0 0 0 2px var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 9px; }
.swatch { width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--c); }
.swatch[aria-checked="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--text); }

/* ---------- Stats ---------- */
.kpi3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi3 .card { margin: 0; padding: 11px 12px; }
.kpi3 b { display: block; margin-top: 4px; font: 700 16px/1.2 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi3 small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart { display: block; width: 100%; height: auto; margin-top: 6px; overflow: visible; }
.c-bar { fill: var(--c-var); }
.c-fix { fill: var(--fixed); }
.c-inc { stroke: var(--text); stroke-width: 2; stroke-linecap: round; }
.c-base { stroke: rgba(255, 255, 255, .16); stroke-width: 1; }
.c-lim { stroke: var(--warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.c-lab { fill: var(--faint); font: 500 10px var(--f-mono); }
.c-limt { fill: var(--warn); font: 600 10px var(--f-mono); }
.c-hit { fill: transparent; cursor: pointer; outline: none; }
.c-hit:focus-visible { stroke: var(--text); stroke-width: 1; }
.c-cap { min-height: 20px; margin: 6px 0 0; font-size: 12.5px; color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.l-inc { height: 2px; border-radius: 1px; background: var(--text); }
details.values { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
details.values summary { cursor: pointer; padding: 6px 0; }
details.values table { width: 100%; border-collapse: collapse; }
details.values td { padding: 5px 0; border-bottom: 1px solid var(--line); font-family: var(--f-mono); font-size: 12px; }
details.values td + td { text-align: right; color: var(--text); }

/* ---------- Réglages ---------- */
.set-card .seg-ctl { margin: 12px 0 0; }
.money-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 14px; }
.money-row label { font-weight: 600; }
.money-input { display: flex; align-items: center; gap: 6px; }
.money-input .input { width: 108px; text-align: right; font: 600 16px var(--f-mono); letter-spacing: -.02em; }
.money-input span { color: var(--muted); font-weight: 650; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.kpis div { padding: 9px 10px; border-radius: 12px; background: var(--card-2); min-width: 0; }
.kpis b { display: block; margin-top: 3px; font: 600 13.5px var(--f-mono); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big-fig { margin: 12px 0 0; font: 700 26px/1.1 var(--f-display); letter-spacing: -.03em; }
.big-fig small { font: 600 13px var(--f-text); color: var(--muted); letter-spacing: 0; }
.hint { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
.rows { padding: 0; }
.row { appearance: none; width: 100%; display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border: 0; background: none; color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row .ic:first-child { color: var(--accent); }
.row .grow { flex: 1; }
.row .chev { color: var(--faint); }
.row.danger, .row.danger .ic:first-child { color: var(--crit); }
.foot { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 22px 0 0; color: var(--faint); font: 500 12px var(--f-mono); }
.foot svg { width: 22px; height: 22px; }

/* ---------- Aide ---------- */
.help h2 { margin: 0 0 4px; font: 650 15px/1.3 var(--f-display); }
.help p { margin: 0; color: var(--muted); font-size: 13.5px; }
.help .btn { margin-top: 10px; }

/* ---------- Effacer des jours ---------- */
.range-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.range-pick label { display: grid; gap: 5px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.range-pick .btn { grid-column: 1 / -1; }
.days-month { margin: 0; padding: 12px 14px 4px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.day-check { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: 11px; padding: 11px 14px; border-top: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.day-check input { width: 18px; height: 18px; margin: 0; accent-color: var(--danger); }
.day-check .dc-meta { font: 500 11.5px var(--f-mono); color: var(--muted); text-align: right; }

/* ---------- Barre d'onglets ---------- */
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding-bottom: var(--sb); background: rgba(9, 12, 10, .92); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.is-form #tabbar { display: none; }
.tabbar-in { max-width: 520px; margin: 0 auto; height: var(--nav); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 100%; color: var(--faint); font-size: 10px; font-weight: 700; text-decoration: none; }
.tab[aria-current="page"] { color: var(--accent); }
.tab-add { justify-self: center; }
.fab { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(180deg, #16613A, var(--pine)); box-shadow: inset 0 0 0 1px rgba(82, 199, 132, .5), 0 8px 22px rgba(11, 61, 31, .65); margin-top: -14px; }

/* ---------- Toast et modale ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav) + var(--sb) + 12px); z-index: 60; transform: translateX(-50%); width: max-content; max-width: min(480px, calc(100vw - 32px)); display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 13px; background: #F2F5F3; color: #0D0D0D; font-size: 14px; font-weight: 650; box-shadow: 0 12px 32px rgba(0, 0, 0, .5); }
.is-form .toast { bottom: calc(var(--sb) + 92px); }
.toast-btn { border: 0; background: none; padding: 6px 0; color: var(--pine); font-weight: 800; }
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: end center; padding: 12px 12px calc(var(--sb) + 12px); }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .66); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.modal-card { position: relative; width: min(100%, 440px); max-height: calc(100dvh - 36px); overflow: auto; padding: 20px 18px 16px; border-radius: 22px; background: #161A17; box-shadow: inset 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, .6); }
.modal-body { color: var(--muted); font-size: 14px; }
.modal-body p { margin: 8px 0; }
.modal-card .input { margin-top: 8px; }
.modal-money { justify-content: flex-start; margin-top: 4px; }
.modal-money .input { width: 150px; margin-top: 0; text-align: right; font: 600 20px var(--f-mono); letter-spacing: -.02em; }
.modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.modal-actions.stack { display: grid; grid-template-columns: 1fr; gap: 6px; }
.modal-actions.stack .btn { width: 100%; }
@media (min-width: 640px) { .modal { place-items: center; } }
.steps { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.steps li { margin: 0 0 10px; padding-left: 2px; }
.steps b { color: var(--text); font-weight: 650; }

    const lab = cycOf(t.d);
    if (!months.includes(lab)) continue;
    const k = clean(norm(t.desc));
    if (!k) continue;
    let g = groups.get(k);
    if (!g) groups.set(k, (g = { desc: t.desc, months: new Set(), amounts: [], days: [], cats: new Map(), thisMonth: false }));
    g.months.add(lab);
    g.amounts.push(t.a);
    g.days.push(Number(t.d.slice(8)));
    g.cats.set(t.cat, (g.cats.get(t.cat) || 0) + 1);
    if (lab === months[0]) g.thisMonth = true;
  }
  const out = [];
  for (const [k, g] of groups) {
    if (g.months.size < 2) continue;
    const a = median(g.amounts);
    if (g.amounts.some(x => Math.abs(x - a) > a * 0.1)) continue;
    if (fixedMatch(g.desc, a, true)) continue;
    const cat = [...g.cats].sort((x, y) => y[1] - x[1])[0][0];
    out.push({ key: k, name: g.desc, a, day: median(g.days), cat, n: g.months.size, thisMonth: g.thisMonth });
  }
  return out.sort((x, y) => y.n - x.n || y.a - x.a).slice(0, 3);
}
/* Saisies fréquentes (60 derniers jours) pour l'ajout en un geste */
function frequents() {
  const since = Date.now() - 60 * 864e5, map = new Map();
  for (const t of DB.tx) {
    if (isIn(t) || t.t < since || !t.desc) continue;
    const k = clean(norm(t.desc)) + '|' + t.a;
    const o = map.get(k) || { n: 0, t: 0, desc: t.desc, a: t.a, cat: t.cat };
    o.n++;
    if (t.t > o.t) { o.t = t.t; o.cat = t.cat; o.desc = t.desc; }
    map.set(k, o);
  }
  return [...map.values()].filter(o => o.n >= 2).sort((a, b) => b.n - a.n || b.t - a.t).slice(0, 6);
}

/* =====================================================================
   7. IA locale : bibliothèque + historique + montant/heure
   ===================================================================== */
let MODEL = null, LIBIDX = null;
function invalidate() { MODEL = null; LIBIDX = null; }

function libIndex() {
  if (LIBIDX) return LIBIDX;
  const valid = new Set(DB.cats.map(c => c.id));
  const list = [];
  const push = (raw, cat, user) => { const kw = clean(norm(raw)); if (kw && kw.length >= 2) list.push({ kw, cat, user }); };
  for (const cat of Object.keys(LIB)) if (valid.has(cat)) LIB[cat].split(',').forEach(k => push(k, cat, false));
  for (const c of DB.cats) {
    for (const w of norm(c.name).split(' ')) if (w.length >= 4 && !STOP.has(w)) push(w, c.id, !c.builtin);
    for (const k of c.kw || []) push(k, c.id, true);
  }
  for (const r of DB.rec) if (r.kind === 'out' && valid.has(r.cat)) push(r.name, r.cat, true);
  list.sort((a, b) => b.kw.length - a.kw.length || (b.user - a.user));
  return (LIBIDX = { list, singles: list.filter(e => e.kw.indexOf(' ') < 0 && e.kw.length >= 5) });
}
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = [];
  for (let j = 0; j <= b.length; j++) prev.push(j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      cur.push(v);
      if (v < rowMin) rowMin = v;
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function libMatch(c, typing, skip) {
  if (!c) return null;
  const { list, singles } = libIndex();
  const ok = e => !skip || e.cat !== skip;
  const padded = ' ' + c + ' ';
  for (const e of list) if (ok(e) && padded.indexOf(' ' + e.kw + ' ') > -1) return { cat: e.cat, kw: e.kw, kind: 'mot', w: e.user ? 1.5 : 1.2 };
  const toks = c.split(' ');
  const last = typing ? toks[toks.length - 1] : '';
  if (last.length >= 3) {
    let best = null;
    for (const e of list) {
      if (!ok(e)) continue;
      const f = e.kw.split(' ')[0];
      if (f.length > last.length && f.startsWith(last) && (!best || e.user > best.user || (e.user === best.user && e.kw.length < best.kw.length))) best = e;
    }
    if (best) return { cat: best.cat, kw: best.kw, kind: 'debut', w: best.user ? 1.0 : 0.8 };
  }
  let bf = null;
  for (const t of toks) {
    if (t.length < 5) continue;
    const max = t.length >= 8 ? 2 : 1;
    for (const e of singles) {
      if (!ok(e) || Math.abs(e.kw.length - t.length) > max) continue;
      const dist = lev(t, e.kw, max);
      if (dist <= max && (!bf || dist < bf.dist || (dist === bf.dist && e.kw.length > bf.e.kw.length))) bf = { e, dist };
    }
  }
  return bf ? { cat: bf.e.cat, kw: bf.e.kw, kind: 'approx', w: 0.7 } : null;
}
function model() {
  if (MODEL) return MODEL;
  const now = Date.now(), HALF = 120 * 864e5;
  const valid = new Set(DB.cats.map(c => c.id));
  const exact = new Map(), exactN = new Map(), tok = new Map(), pts = [];
  const bump = (map, k, cat, w) => { let m = map.get(k); if (!m) map.set(k, (m = new Map())); m.set(cat, (m.get(cat) || 0) + w); };
  for (const t of DB.tx) {
    if (!valid.has(t.cat)) continue;
    const w = Math.pow(0.5, Math.max(0, now - t.t) / HALF);
    const c = clean(norm(t.desc));
    if (c) {
      bump(exact, c, t.cat, w);
      exactN.set(c, (exactN.get(c) || 0) + 1);
      for (const k of new Set(c.split(' '))) if (k.length >= 3 && !STOP.has(k)) bump(tok, k, t.cat, w);
    }
    if (!isIn(t)) pts.push({ la: Math.log1p(t.a / 100), h: new Date(t.t).getHours(), cat: t.cat, w });
  }
  return (MODEL = { exact, exactN, tok, pts, valid });
}
/* opts.noIncome : une dépense n'est jamais classée en revenu */
function predict(desc, cents, typing, opts) {
  const M = model();
  const skip = opts && opts.noIncome ? INCOME : null;
  const c = clean(norm(desc));
  const S = new Map(), SRC = new Map();
  const add = (cat, v, src) => {
    if (!(v > 0) || !M.valid.has(cat) || cat === skip) return;
    S.set(cat, (S.get(cat) || 0) + v);
    const o = SRC.get(cat) || { hist: 0, lib: 0, amt: 0 };
    o[src] += v;
    SRC.set(cat, o);
  };
  let lib = null;
  if (c) {
    const ex = M.exact.get(c);
    if (ex) {
      let tot = 0;
      for (const w of ex.values()) tot += w;
      const conf = tot / (tot + 0.6);
      for (const [cat, w] of ex) add(cat, 3 * conf * w / tot, 'hist');
    }
    const votes = new Map();
    let wsum = 0;
    for (const k of new Set(c.split(' '))) {
      if (k.length < 3 || STOP.has(k)) continue;
      const d = M.tok.get(k);
      if (!d) continue;
      let tot = 0, max = 0;
      for (const w of d.values()) tot += w;
      for (const w of d.values()) max = Math.max(max, w / tot);
      const weight = max * tot / (tot + 1);
      for (const [cat, w] of d) votes.set(cat, (votes.get(cat) || 0) + weight * w / tot);
      wsum += weight;
    }
    for (const [cat, v] of votes) add(cat, 1.6 * v / Math.max(1, wsum), 'hist');
    lib = libMatch(c, typing, skip);
    if (lib) add(lib.cat, lib.w, 'lib');
  }
  if (!S.size && cents > 0 && M.pts.length >= 4) {
    const la = Math.log1p(cents / 100), h = new Date().getHours();
    const votes = new Map();
    let tot = 0;
    for (const p of M.pts) {
      const da = (p.la - la) / 0.22;
      let dh = Math.abs(p.h - h);
      dh = Math.min(dh, 24 - dh) / 3;
      const k = p.w * Math.exp(-0.5 * (da * da + dh * dh));
      if (k < 1e-3) continue;
      votes.set(p.cat, (votes.get(p.cat) || 0) + k);
      tot += k;
    }
    if (tot > 0.05) {
      const conf = tot / (tot + 1);
      for (const [cat, v] of votes) add(cat, conf * v / tot, 'amt');
    }
  }
  if (!S.size) return null;
  let total = 0;
  for (const v of S.values()) total += v;
  const ranked = [...S].sort((a, b) => b[1] - a[1]);
  const [cat, score] = ranked[0];
  const o = SRC.get(cat);
  const source = o.hist >= o.lib && o.hist >= o.amt ? 'hist' : (o.lib >= o.amt ? 'lib' : 'amt');
  const conf = Math.min(0.99, (score / total) * Math.min(1, score / 1.4));
  if (conf < (source === 'amt' ? 0.2 : 0.15)) return null;
  return { cat, conf, source, lib };
}

/* Jauge segmentée : 36 segments sur 270°, anneau intérieur si dépassement */
let GAUGE_SWEPT = false, LAST_LIT = null;
function gaugeSVG(spent, limit) {
  const N = 36, cx = 160, cy = 158, r1 = 122, r2 = 142;
  const ratio = limit > 0 ? spent / limit : (spent > 0 ? 2 : 0);
  const st = ratio > 1 ? 'crit' : ratio >= 0.8 ? 'warn' : 'good';
  const lit = spent > 0 ? Math.max(1, Math.min(N, Math.round(Math.min(1, ratio) * N))) : 0;
  const over = ratio > 1 ? Math.max(1, Math.min(N, Math.round(Math.min(1, ratio - 1) * N))) : 0;
  let segs = '', ovr = '';
  for (let i = 0; i < N; i++) {
    const a = (135 + (i + 0.5) * 270 / N) * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
    segs += '<line class="seg' + (i < lit ? ' on' : '') + '" x1="' + (cx + r1 * co).toFixed(1) + '" y1="' + (cy + r1 * si).toFixed(1) +
      '" x2="' + (cx + r2 * co).toFixed(1) + '" y2="' + (cy + r2 * si).toFixed(1) + '"/>';
    if (over) ovr += '<line class="ovr' + (i < over ? ' on' : '') + '" x1="' + (cx + 108 * co).toFixed(1) + '" y1="' + (cy + 108 * si).toFixed(1) +
      '" x2="' + (cx + 113 * co).toFixed(1) + '" y2="' + (cy + 113 * si).toFixed(1) + '"/>';
  }
  const amt = money(spent);
  const size = Math.min(54, Math.floor(200 / (amt.length * 0.58)));
  const p = limit > 0 ? Math.round(100 * spent / limit) : (spent > 0 ? 100 : 0);
  return '<svg class="gauge-svg st-' + st + '" viewBox="0 0 320 290" aria-hidden="true" data-lit="' + lit + '">' +
    '<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/>' +
    '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
    '<g class="segs" filter="url(#glow)">' + segs + '</g>' +
    (over ? '<g filter="url(#glow)">' + ovr + '</g>' : '') +
    '<text class="g-pct" x="160" y="110" text-anchor="middle">' + esc(HIDE ? '••' : pct(p)) + '</text>' +
    '<text class="g-amt" x="160" y="' + (150 + size * 0.36).toFixed(0) + '" text-anchor="middle" font-size="' + size + '">' + esc(amt) + '</text>' +
    '<text class="g-sub" x="160" y="' + (182 + size * 0.36).toFixed(0) + '" text-anchor="middle">sur ' + esc(money(limit)) + '</text>' +
    '<text class="g-end" x="84" y="282" text-anchor="middle">0</text>' +
    '<text class="g-end" x="236" y="282" text-anchor="middle">' + esc(moneyShort(limit)) + '</text>' +
    '</svg>';
}
function sweepGauge() {
  const svg = $('.gauge-svg');
  if (!svg) return;
  const lit = Number(svg.dataset.lit) || 0;
  const from = GAUGE_SWEPT ? LAST_LIT : 0;
  GAUGE_SWEPT = true;
  LAST_LIT = lit;
  if (from == null || lit <= from) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const segs = $$('.seg', svg), span = lit - from;
  segs.forEach((s, i) => s.classList.toggle('on', i < from));
  const t0 = performance.now(), dur = 380 + span * 14;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3), n = from + Math.round(e * span);
    segs.forEach((s, i) => s.classList.toggle('on', i < n));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function dailyChart(mk, limit) {

  const max = Math.max(limit || 0, ...vals, 100);
  const yOf = v => base - (v / max) * (base - top);
  let bars = '', hits = '', labs = '';
  for (let i = 0; i < dim; i++) {
    const x = 4 + step * i + (step - bw) / 2, v = vals[i], yy = yOf(v);
    if (i < last && v > 0) bars += '<path class="c-bar" d="' + roundTop(x, yy, bw, base - yy, 2) + '"/>';
    const k = addDays(s0, i), lab = typo(cap1(DF_SHORT.format(dateOf(k))) + ' : ' + money(v));
    if (i < last) hits += '<rect class="c-hit" x="' + (4 + step * i).toFixed(1) + '" y="0" width="' + step.toFixed(1) + '" height="' + (base + 4) + '" tabindex="0" role="img" aria-label="' + esc(lab) + '" data-cap="' + esc(lab) + '"/>';
    if (i === 0 || (i + 1) % 5 === 0) labs += '<text class="c-lab" x="' + (x + bw / 2).toFixed(1) + '" y="' + (base + 14) + '" text-anchor="middle">' + Number(k.slice(8)) + '</text>';
  }
  const ly = yOf(limit || 0);
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + (base + 20) + '" role="group" aria-label="Dépenses par jour">' +
    '<line class="c-base" x1="4" x2="' + (W - 4) + '" y1="' + base + '" y2="' + base + '"/>' + bars +
    (limit > 0 ? '<line class="c-lim" x1="4" x2="' + (W - 4) + '" y1="' + ly.toFixed(1) + '" y2="' + ly.toFixed(1) + '"/><text class="c-limt" x="' + (W - 4) + '" y="' + (ly - 5).toFixed(1) + '" text-anchor="end">limite ' + esc(moneyShort(limit)) + '</text>' : '') +
    labs + hits + '</svg>';
}
function monthsChart(n) {
  const cur = curMK(), rows = [];
  for (let k = n - 1; k >= 0; k--) {
    const d = new Date(mkY(cur), mkM(cur) - k, 1);
    const s = monthSums(d.getFullYear(), d.getMonth());
    rows.push({ label: cap1(DF_MSHORT.format(d)).replace('.', ''), full: monthLabel(d.getFullYear(), d.getMonth()), fixed: s.fixed, vari: s.vari, inc: s.inc });
  }
  const W = 340, base = 128, top = 12, step = (W - 8) / n, bw = Math.min(30, step * 0.46);
  const max = Math.max(100, ...rows.map(r => Math.max(r.fixed + r.vari, r.inc)));
  const h = v => (v / max) * (base - top);
  let g = '', hits = '', labs = '';
  rows.forEach((r, i) => {
    const x = 4 + step * i + (step - bw) / 2;
    const hf = h(r.fixed), hv = h(r.vari);
    if (hf > 0) g += '<rect class="c-fix" x="' + x.toFixed(1) + '" y="' + (base - hf).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hf.toFixed(1) + '"/>';
    if (hv > 0) g += '<path class="c-bar" d="' + roundTop(x, base - hf - hv - (hf > 0 ? 2 : 0), bw, hv, 4) + '"/>';
    else if (hf > 0) g += '<path class="c-fix" d="' + roundTop(x, base - hf, bw, Math.min(4, hf), 4) + '"/>';
    if (r.inc > 0) { const iy = base - h(r.inc); g += '<line class="c-inc" x1="' + (x - 5).toFixed(1) + '" x2="' + (x + bw + 5).toFixed(1) + '" y1="' + iy.toFixed(1) + '" y2="' + iy.toFixed(1) + '"/>'; }
    const cap = typo(r.full + ' : fixes ' + money(r.fixed) + ', variables ' + money(r.vari) + ', revenus ' + money(r.inc));
    hits += '<rect class="c-hit" x="' + (4 + step * i).toFixed(1) + '" y="0" width="' + step.toFixed(1) + '" height="' + (base + 18) + '" tabindex="0" role="img" aria-label="' + esc(cap) + '" data-cap="' + esc(cap) + '"/>';
    labs += '<text class="c-lab" x="' + (x + bw / 2).toFixed(1) + '" y="' + (base + 15) + '" text-anchor="middle">' + esc(r.label) + '</text>';
  });
  return { svg: '<svg class="chart" viewBox="0 0 ' + W + ' ' + (base + 20) + '" role="group" aria-label="Six derniers mois">' +
    '<line class="c-base" x1="4" x2="' + (W - 4) + '" y1="' + base + '" y2="' + base + '"/>' + g + labs + hits + '</svg>', rows };
}

/* ---------- Historique ---------- */
let HIST = null;
function histList() {
  const q = clean(norm(HIST.q)), cm = catMap();
  return monthEntries(HIST.y, HIST.m).filter(t => {
    if (HIST.c === '_fixes' && !(t.virtual && t.kind === 'out')) return false;
    if (HIST.c && HIST.c !== '_fixes' && t.cat !== HIST.c) return false;
    return !q || (norm(t.desc) + ' ' + norm((cm.get(t.cat) || {}).name)).indexOf(q) > -1;
  }).sort(byRecent);
}
function histBody(list) {
  if (!list.length) return '<div class="card empty"><p>' + (HIST.q || HIST.c ? 'Aucun résultat.' : 'Aucune entrée ce mois-ci.') + '</p></div>';
  const cm = catMap(), groups = new Map();
  for (const t of list) { if (!groups.has(t.d)) groups.set(t.d, []); groups.get(t.d).push(t); }
  let html = '';
  for (const [d, arr] of groups) {
    const out = arr.filter(t => !isIn(t)).reduce((s, t) => s + t.a, 0);
    html += '<h3 class="day-head"><span>' + esc(dayLabel(d)) + '</span><span class="mono">' + (out ? money(out) : '') + '</span></h3>' +
      '<ul class="card list">' + arr.map(t => txRowHTML(t, cm, false)).join('') + '</ul>';
  }
  return html;
}
function histSums(list) {
  let o = 0, i = 0;
  for (const t of list) if (isIn(t)) i += t.a; else o += t.a;
  return { o, i };
}
function viewHistory(r) {

function fitAmount(el) {
  if (!el) return;
  const v = el.value || el.placeholder || '';
  try {
    if (!FIT_CTX) FIT_CTX = document.createElement('canvas').getContext('2d');
    el.style.fontSize = '';
    const cs = getComputedStyle(el), base = parseFloat(cs.fontSize) || 46;
    const measure = size => {
      FIT_CTX.font = cs.fontWeight + ' ' + size + 'px ' + cs.fontFamily;
      if ('letterSpacing' in FIT_CTX) FIT_CTX.letterSpacing = (-0.035 * size) + 'px';
      return FIT_CTX.measureText(v).width * 1.02 + size * 0.08;
    };
    const avail = (el.parentNode ? el.parentNode.clientWidth : 300) - 40;
    let size = base, w = measure(size);
    if (w > avail && avail > 0) { size = Math.max(22, Math.floor(base * avail / w)); el.style.fontSize = size + 'px'; w = measure(size); }
    el.style.width = Math.ceil(w) + 'px';
  } catch (e) {
    el.style.width = (Math.max(2, v.length) + 0.7) + 'ch';
  }
}

async function saveForm() {
  const cents = parseAmount(F.amount);
  if (!cents || cents <= 0) return formError('Entre un montant supérieur à 0 €.', 'f-amount');
  if (cents > 100000000) return formError('Montant trop élevé : 1 000 000 € maximum.', 'f-amount');
  const kind = F.kind, cat = kind === 'in' ? INCOME : F.cat;
  if (kind === 'out' && (!cat || cat === INCOME || !DB.cats.some(c => c.id === cat))) return formError('Choisis une catégorie.');
  const desc = F.desc.trim().slice(0, 60);
  const day = Math.min(31, Math.max(1, Math.round(Number(F.day)) || 1));
  if (F.monthly && F.mode === 'add' && !desc) return formError('Donne un nom à cette entrée mensuelle.', 'f-desc');
  const date = /^\d{4}-\d{2}-\d{2}$/.test(F.date) ? F.date : today();
  const mode = F.mode, id = F.id, rid = F.rid, predicted = F.pred ? F.pred.cat : null, launch = !!F.launch;

  /* Doublon probable avec une dépense fixe déjà comptée */
  if (kind === 'out' && !F.monthly && (mode === 'add' || mode === 'pay')) {
    const r = fixedMatch(desc, cents);
    if (r) {
      const ok = await modal({ title: 'Déjà dans tes fixes ?', body: '<p>« ' + esc(r.name) + ' » (' + moneyRaw(r.a) + ', le ' + r.day + ') est déjà comptée chaque mois. L\'ajouter en plus la compterait deux fois.</p>', confirm: 'Ajouter quand même' });
      if (!ok) return;
    }
  }
  if (mode === 'rec') {
    /* Nouveau montant habituel : les mois passés gardent leur montant */
    let frozen = false;
    const vary = !!F.vary;
    commit(db => {
      const x = db.rec.find(z => z.id === rid);
      if (!x) return;
      if (x.a !== cents && x.start < curMK()) { freezePast(x, curMK()); frozen = true; }
      Object.assign(x, { a: cents, name: desc || x.name, cat, day, vary });
    }, { render: false });
    toast(frozen ? 'Enregistré, à partir de ce mois-ci' : 'Enregistré');
    F = null; FORM_KEY = null;
    return goBack(kind === 'in' ? '#/budget/revenus' : '#/budget/fixes');
  }
  if (mode === 'edit') {
    commit(db => {
      const t = db.tx.find(x => x.id === id);
      if (!t) return;
      if (t.d !== date) {
        const old = new Date(t.t), d = dateOf(date);
        d.setHours(old.getHours(), old.getMinutes(), old.getSeconds());
        t.t = d.getTime();
        t.d = date;
      }
      t.a = cents; t.desc = desc; t.cat = cat;
    }, { render: false });
    toast('Modification enregistrée');
    F = null; FORM_KEY = null;
    return goBack();
  }
  if (F.monthly) {
    const seen = paidThisMonth(kind, desc, cents);
    const start = seen ? nextMK(curMK()) : curMK();
    const vary = !!F.vary;
    const ov = {};
    if (vary && start === curMK() && dueKey({ day }, start) <= today()) ov[start] = cents;
    const nid = uid();
    commit(db => {
      db.rec.push({ id: nid, kind, a: cents, name: desc, cat, day, start, end: null, vary, ov });
      if (kind === 'in' && db.settings.cyc.on && !db.settings.cyc.rec) db.settings.cyc.rec = nid;
    }, { render: false });
    const e = kind === 'in' ? '' : 'e';
    toast((kind === 'in' ? 'Revenu mensuel ajouté' : 'Dépense fixe ajoutée') + (seen ? ', compté' + e + ' dès ' + DF_MONTHN.format(dateOf(start + '-01')) + ' (déjà saisi' + e + ' ce mois-ci)' : ''), { timeout: seen ? 5000 : 3000 });
  } else {
    const now = new Date();
    let ts = now.getTime();
    if (date !== today()) { const d = dateOf(date); d.setHours(now.getHours(), now.getMinutes(), now.getSeconds()); ts = d.getTime(); }
    commit(db => { db.tx.push({ id: uid(), a: cents, d: date, t: ts, desc, cat, src: mode === 'pay' ? 'applepay' : 'manual', p: kind === 'out' ? predicted : null }); }, { render: false });
    toast((kind === 'in' ? 'Revenu ajouté : ' : mode === 'pay' ? 'Paiement enregistré : ' : 'Dépense ajoutée : ') + moneyRaw(cents));
  }
  askPersist();
  F = null; FORM_KEY = null;
  if (mode === 'pay' || launch) location.replace('#/'); else goBack();
}

async function removeTx(id) {
  let removed = null;
  commit(db => { const i = db.tx.findIndex(t => t.id === id); if (i > -1) removed = db.tx.splice(i, 1)[0]; });
  if (!removed) return false;
  toast(isIn(removed) ? 'Revenu supprimé' : 'Dépense supprimée', {
    action: 'Annuler', timeout: 6000,
    onAction: () => commit(db => { if (!db.tx.some(t => t.id === removed.id)) db.tx.push(removed); })
  });
  return true;
}
/* Arrêter un revenu mensuel ou une dépense fixe : les mois passés restent intacts */
async function stopRec(id) {
  const r = DB.rec.find(x => x.id === id);
  if (!r) return false;
  const mk = curMK(), prev = prevMK(mk);
  const ended = !!r.end && r.end < mk;
  const end = dueKey(r, mk) <= today() ? mk : prev;
  const wipeOnly = ended || end < r.start;
  const name = '« ' + esc(r.name) + ' »';
  let res;
  if (wipeOnly) {
    res = await modal({
      title: 'Supprimer ' + (r.kind === 'in' ? 'ce revenu' : 'cette dépense fixe') + ' ?',
      body: '<p>' + name + (ended ? ' disparaîtra aussi des mois passés.' : ' sera supprimé.') + '</p>',
      confirm: 'Supprimer', danger: true
    });
    if (res) res = 'alt';
  } else {
    res = await modal({
      title: 'Arrêter ' + (r.kind === 'in' ? 'ce revenu' : 'cette dépense fixe') + ' ?',
      body: '<p>' + name + ' ne sera plus compté ' + (end === mk ? 'à partir du mois prochain' : 'à partir de ce mois-ci') + '. Les mois passés ne changent pas.</p>',
      confirm: 'Arrêter', danger: true, alt: 'Supprimer partout'
    });
  }
  if (!res) return false;
  const snap = JSON.parse(JSON.stringify(r));
  const wipe = res === 'alt';
  commit(db => {
    if (wipe) db.rec = db.rec.filter(x => x.id !== id);
    else { const x = db.rec.find(z => z.id === id); if (x) x.end = end; }
  }, { render: false });
  toast(wipe ? 'Supprimé' : (r.kind === 'in' ? 'Revenu arrêté' : 'Dépense fixe arrêtée'), {
    action: 'Annuler', timeout: 6000,
    onAction: () => commit(db => { db.rec = db.rec.filter(x => x.id !== snap.id).concat([snap]); })
  });
  return true;
}

function saveMonth() {

  if (cents > 100000000) return formError('Montant trop élevé : 1 000 000 € maximum.', 'm-amount');
  const keep = MF.keep;
  let kind = 'in';
  commit(db => {

  }, { render: false });
  toast('Montant de ' + DF_MONTHN.format(dateOf(mk + '-01')) + ' : ' + moneyRaw(cents) + (keep ? ', gardé pour la suite' : ''));

}

        '</section>';
    }).join('') + '</div>';
}
function setCycle(mk, which, v) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { render(); return; }
  const target = which === 'start' ? mk : nextMK(mk), start = which === 'start' ? v : addDays(v, 1);
  const lo = shownStart(prevMK(target)), hi = shownStart(nextMK(target));
  if (start <= addDays(lo, 6) || start >= addDays(hi, -6) || Math.abs(daysBetween(cycDefault(target), start)) > 20) {
    toast('Date impossible : les mois se chevaucheraient.');
    render();
    return;
  }
  commit(db => { db.cycles[target] = start; });
  toast(cap1(monthName(target)) + ' commence le ' + DF_DM.format(dateOf(start)));
}

async function shareOrDownload(blob, name) {
  try {
    const file = new File([blob], name, { type: blob.type });
    const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
async function exportJSON() {
  const data = { app: 'sousous', version: VERSION, exportedAt: new Date().toISOString(), db: DB };

   11. Capture depuis l'URL (?amount=12.50&merchant=Uber)
   ===================================================================== */
const CAP_KEYS = ['amount', 'montant', 'merchant', 'marchand', 'commercant', 'description', 'desc', 'label', 'category', 'categorie', 'cat', 'date'];
function parseQuery(search) {
  const s = (search || '').replace(/^\?/, '');
  const out = {};
  if (!s) return out;
  const re = new RegExp('(^|&)(' + CAP_KEYS.join('|') + ')=', 'gi');
  const hits = [];
  let m;
  while ((m = re.exec(s))) hits.push({ key: m[2].toLowerCase(), start: m.index, val: re.lastIndex });
  hits.forEach((h, i) => {
    const end = i + 1 < hits.length ? hits[i + 1].start : s.length;
    out[h.key] = safeDecode(s.slice(h.val, end).replace(/\+/g, ' ')).trim();
  });
  return out;
}
function readCapture() {
  const q = parseQuery(location.search);
  const pick = (...keys) => { for (const k of keys) if (q[k] != null) return q[k]; return null; };
  const amountRaw = pick('amount', 'montant');
  let merchant = pick('merchant', 'marchand', 'commercant', 'description', 'desc', 'label') || '';
  if (/^(commercant|commerçant|merchant)$/i.test(merchant)) merchant = '';
  if (amountRaw == null && !merchant) return null;
  const cents = amountRaw != null && !/^montant$/i.test(amountRaw) ? parseAmount(amountRaw) : null;
  let cat = null;
  const cq = pick('category', 'categorie', 'cat');
  if (cq) { const n = norm(cq); const c = DB.cats.find(x => x.id !== INCOME && (x.id === cq || norm(x.name) === n)); if (c) cat = c.id; }
  const date = q.date && /^\d{4}-\d{2}-\d{2}$/.test(q.date) ? q.date : null;
  return { amountRaw: amountRaw || '', cents: cents && cents > 0 ? cents : null, merchant: merchant.slice(0, 120), cat, date };
}

/* Repli presse-papiers : iOS ignore les paramètres de webapp:// quand l'app est fermée.
   Le raccourci copie « Montant | Commerçant | Date » ; l'app le colle en un geste. */
const AMOUNT_LIKE = /^\s*(€\s*)?\d[\d\s.,\u00A0\u202F'’]*\s*(€|eur|euros?)?\s*$/i;
function parseClip(text) {
  const s = String(text == null ? '' : text).trim();
  if (!s || s.length > 500) return null;
  let amountRaw, merchant = '';
  const qi = s.search(/[?&](amount|montant)=/i);
  if (qi > -1) {
    const q = parseQuery(s.slice(s.indexOf('?') > -1 && s.indexOf('?') <= qi ? s.indexOf('?') + 1 : qi + 1));
    amountRaw = q.amount || q.montant || '';
    merchant = q.merchant || q.marchand || q.commercant || q.description || q.desc || q.label || '';
  } else {
    const parts = s.replace(/^sousous\s*[:|]?\s*/i, '').split(/\s*[|\n\r]+\s*/);
    amountRaw = parts[0] || '';
    if (!AMOUNT_LIKE.test(amountRaw)) return null;
    merchant = parts[1] || '';
  }
  if (/^(montant|amount)$/i.test(amountRaw)) return null;
  const cents = parseAmount(amountRaw);
  if (!cents || cents <= 0 || cents > 100000000) return null;
  if (/^(commercant|commerçant|merchant)$/i.test(merchant)) merchant = '';
  return { cents, amountRaw, merchant: merchant.trim().slice(0, 120) };
}
/* Même paiement déjà enregistré récemment (URL puis collage, ou double collage) */

}

const ROUTES = { '': viewHome, historique: viewHistory, ajouter: viewForm, modifier: viewForm, paiement: viewForm, recurrent: viewForm, mois: viewMonth, cycles: viewCycles, budget: viewBudget, categorie: viewCatForm, reglages: viewSettings, aide: viewHelp, effacer: viewErase };
const FORM_ROUTES = ['ajouter', 'modifier', 'paiement', 'recurrent'];
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const qi = h.indexOf('?');
  const path = qi > -1 ? h.slice(0, qi) : h, qs = qi > -1 ? h.slice(qi + 1) : '';
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || '', arg: parts[1] ? safeDecode(parts[1]) : null, arg2: parts[2] ? safeDecode(parts[2]) : null, q: new URLSearchParams(qs) };
}
const isFormRoute = r => FORM_ROUTES.includes(r.name) || ['categorie', 'effacer', 'mois', 'cycles'].includes(r.name);
const TAB_OF = { '': '', historique: 'historique', budget: 'budget', reglages: 'reglages', aide: 'reglages' };

let LAST_KEY = null;
function render() {
  const r = route();
  const fn = Object.prototype.hasOwnProperty.call(ROUTES, r.name) ? ROUTES[r.name] : viewHome;
  if (!FORM_ROUTES.includes(r.name)) { F = null; FORM_KEY = null; }
  if (r.name !== 'categorie') { CF = null; CF_KEY = null; }
  if (r.name !== 'mois') { MF = null; MF_KEY = null; }
  const html = fn(r);
  if (html == null) return;
  document.body.classList.toggle('is-form', isFormRoute(r));
  const view = $('#view');
  view.innerHTML = html;
  typoDom(view);
  fitAmount($('#f-amount'));
  fitAmount($('#m-amount'));
  const tab = TAB_OF[r.name];
  $$('#tabbar .tab[data-tab]').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const key = r.name + '/' + (r.arg || '') + (r.arg2 ? '/' + r.arg2 : '');
  if (key !== LAST_KEY) {
    const changed = LAST_KEY !== null;
    const sameView = LAST_KEY && LAST_KEY.split('/')[0] === r.name && r.name === 'budget';
    LAST_KEY = key;
    if (!sameView) window.scrollTo(0, 0);
    if (r.name === 'ajouter' || r.name === 'mois') {
      const a = $('#f-amount') || $('#m-amount');
      if (a) a.focus({ preventScroll: true });
      const kb = $('#kb-proxy');
      if (kb && document.activeElement === kb) kb.blur();
    } else if (changed && !sameView) {
      const h = $('#view h1');
      if (h) h.focus({ preventScroll: true });
    }
  }
  if (r.name === '') { sweepGauge(); if (PROMPT_PENDING) setTimeout(promptConfirm, 350); }
}
function softRender() { if (!isFormRoute(route())) render(); }

  },
  'hist-cat': el => { HIST.c = el.dataset.cat || ''; render(); },
  chip: el => { F.cat = el.dataset.cat; F.byUser = true; const e = $('#f-err'); if (e && F.mode !== 'pay') e.hidden = true; syncForm(); },
  kind: el => {
    F.kind = el.dataset.v === 'in' ? 'in' : 'out';
    F.cat = F.kind === 'in' ? INCOME : null;
    F.byUser = F.kind === 'in';
    F.vary = F.kind === 'in';
    aiUpdate(false);
    const d = $('#f-desc');
    if (d) d.placeholder = F.kind === 'in' ? 'Salaire, CAF, remboursement…' : 'Uber, Carrefour, cinéma…';
  },
  monthly: () => { F.monthly = !F.monthly; syncForm(); },
  vary: () => { F.vary = !F.vary; syncForm(); },
  'mf-keep': el => { MF.keep = !MF.keep; el.setAttribute('aria-checked', String(MF.keep)); },
  'mf-save': () => saveMonth(),
  'mf-reset': () => resetMonth(),
  'pay-confirm': () => confirmPay(true),
  cyc: el => {
    const on = el.dataset.v === 'pay';
    commit(db => {
      db.settings.cyc.on = on;
      if (on && !db.rec.some(r => r.id === db.settings.cyc.rec && r.kind === 'in')) {
        const inc = db.rec.filter(r => r.kind === 'in' && (!r.end || r.end >= curMK())).sort((a, b) => b.a - a.a)[0];
        db.settings.cyc.rec = inc ? inc.id : null;
      }
    });
    toast(cap1(monthName(curMK())) + ' : ' + rangeLabel(curMK()));
  },
  'cyc-reset': el => { const mk = el.dataset.mk; commit(db => { delete db.cycles[mk]; }); },
  freq: el => {
    const o = F.freq && F.freq[Number(el.dataset.i)];
    if (!o) return;
    /* Catégorie de la dernière saisie identique ; l'IA reprend la main si la description change */
    F.amount = numInput(o.a); F.desc = o.desc; F.cat = o.cat; F.byUser = false;
    F.pred = predict(F.desc, o.a, false, { noIncome: true });
    const a = $('#f-amount'), d = $('#f-desc');
    if (a) { a.value = F.amount; fitAmount(a); }
    if (d) d.value = F.desc;
    const e = $('#f-err');
    if (e && F.mode !== 'pay') e.hidden = true;
    syncForm();
  },
  save: () => saveForm(),
  delete: async () => { const id = F.id; if (await removeTx(id)) { F = null; FORM_KEY = null; goBack(); } },
  ignore: () => { F = null; FORM_KEY = null; toast('Paiement ignoré'); location.replace('#/'); },
  'del-tx': el => removeTx(el.dataset.id),
  'stop-rec': async el => {
    const inForm = route().name === 'recurrent';
    const r = DB.rec.find(x => x.id === el.dataset.id);
    if (await stopRec(el.dataset.id)) {
      if (inForm) { F = null; FORM_KEY = null; goBack(r && r.kind === 'in' ? '#/budget/revenus' : '#/budget/fixes'); }
      else render();
    }
  },
  'sugg-add': el => {
    const s = fixedSuggestions()[Number(el.dataset.i)];
    if (!s) return;
    const start = s.thisMonth ? nextMK(curMK()) : curMK();
    commit(db => { db.rec.push({ id: uid(), kind: 'out', a: s.a, name: s.name, cat: s.cat, day: s.day, start, end: null, vary: false, ov: {} }); });
    toast(s.thisMonth ? 'Ajoutée aux fixes à partir du mois prochain' : 'Ajoutée aux dépenses fixes');
  },
  'toggle-budget': el => { const id = el.dataset.id; commit(db => { const c = db.cats.find(x => x.id === id); if (c) c.budget = c.budget === false; }); },
  'cf-icon': el => { CF.icon = el.dataset.icon; $$('.icon-opt').forEach(b => b.setAttribute('aria-checked', String(b.dataset.icon === CF.icon))); refreshCatPreview(); },
  'cf-color': el => { CF.color = Number(el.dataset.color); $$('.swatch').forEach(b => b.setAttribute('aria-checked', String(Number(b.dataset.color) === CF.color))); refreshCatPreview(); },
  'cf-budget': el => { CF.budget = !CF.budget; el.setAttribute('aria-checked', String(CF.budget)); },
  'cf-save': () => saveCat(),
  'cf-delete': () => deleteCat(),
  mode: el => { const m = el.dataset.mode; commit(db => { db.settings.mode = m === 'income' ? 'income' : 'manual'; }); },
  hide: () => { commit(db => { db.settings.hide = !db.settings.hide; }); },
  applepay: () => applePayModal(),
  copy: el => copyText(el.dataset.copy, el.dataset.msg),
  paste: () => pasteCapture(),
  open: el => { const v = el.dataset.v === 'home' ? 'home' : 'pay'; commit(db => { db.settings.open = v; }); },
  'clip-test': async () => {
    try { await navigator.clipboard.writeText('12,50 € | Uber | test'); }
    catch (e) { toast('Copie impossible'); return; }
    commit(db => { db.meta.clip = true; db.meta.lastClip = ''; }, { render: false });
    markForeground();
    toast('Paiement test copié : ferme cette fenêtre, puis touche + et l\'icône presse-papiers.', { timeout: 5000 });
  },
  'export-json': () => exportJSON(),
  'export-csv': () => exportCSV(),
  import: () => { const f = $('#import-file'); f.value = ''; f.click(); },
  'dz-range': () => {
    const f = DZR.from, t = DZR.to;
    if (!f || !t) { toast('Choisis les deux dates.'); return; }
    const a = f <= t ? f : t, b = f <= t ? t : f;
    let k = 0;
    for (const d of daysWithData().keys()) if (d >= a && d <= b) { DZSEL.add(d); k++; }
    render();
    toast(k ? plural(k, 'jour coché', 'jours cochés') : 'Rien sur cette période.');
  },
  'dz-delete': () => deleteDays(),
  reset: () => resetAll()
};

document.addEventListener('click', e => {
  const af = e.target.closest('.amount-field');
  if (af && e.target.id !== 'f-amount') { const inp = $('#f-amount'); if (inp) inp.focus(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  const res = fn(el, e);
  if (res !== 'default' && el.tagName === 'A') e.preventDefault();
});

/* Légendes des graphiques au survol, au focus et au toucher */
const chartCap = e => {
  const r = e.target.closest && e.target.closest('.c-hit');
  if (!r) return;
  const cap = r.closest('.card') && r.closest('.card').querySelector('.c-cap');
  if (cap) cap.textContent = r.dataset.cap;
};
document.addEventListener('pointerover', chartCap);
document.addEventListener('focusin', chartCap);
document.addEventListener('click', chartCap);

document.addEventListener('input', e => {
  const t = e.target, id = t.id;
  if (id === 'f-amount' && F) {
    F.amount = t.value;
    fitAmount(t);
    const er = $('#f-err');
    if (er && F.mode !== 'pay') er.hidden = true;
    if (!F.desc.trim()) aiUpdate(false); else syncForm();
  } else if (id === 'f-desc' && F) {
    F.desc = t.value;
    clearTimeout(aiTimer);
    aiTimer = setTimeout(() => aiUpdate(true), 120);
  } else if (id === 'f-day' && F) F.day = t.value;
  else if (id === 'm-amount' && MF) { MF.amount = t.value; fitAmount(t); const er = $('#f-err'); if (er) er.hidden = true; }
  else if (id === 'h-search' && HIST) {
    HIST.q = t.value;
    clearTimeout(aiTimer);
    aiTimer = setTimeout(refreshHistList, 120);
  } else if (id === 'c-name' && CF) {
    CF.name = t.value;
    const p = $('#cf-pname');
    if (p) p.textContent = CF.name || 'Nom';
  } else if (id === 'c-kw' && CF) CF.kw = t.value;
  else if (id === 'c-cap' && CF) CF.cap = t.value;
});
document.addEventListener('change', e => {
  const t = e.target, id = t.id;
  if (id === 'f-date' && F) F.date = t.value || today();
  else if (id === 'f-desc' && F) { F.desc = t.value; aiUpdate(false); }
  else if (id === 's-limit') {
    const c = parseAmount(t.value);
    if (!c || c < 100) { toast('Limite minimale : 1 €.'); t.value = numInput(DB.settings.limit); return; }
    commit(db => { db.settings.limit = c; }, { render: false });
    t.value = numInput(c);
    toast('Limite : ' + money(c) + ' par jour');
  } else if (id === 's-save') {
    const c = t.value.trim() ? parseAmount(t.value) : 0;
    if (c == null) { toast('Montant invalide.'); t.value = DB.settings.save ? numInput(DB.settings.save) : ''; return; }
    commit(db => { db.settings.save = c; });
    toast(c ? 'Épargne : ' + money(c) + ' par mois' : 'Épargne retirée');
  } else if (id === 's-cycrec') { const v = t.value; commit(db => { db.settings.cyc.rec = v || null; }); }
  else if (id === 's-cycday') {
    const v = Math.round(Number(t.value));
    if (!(v >= 2 && v <= 28)) { toast('Choisis un jour entre 2 et 28.'); t.value = cycDay(); return; }
    commit(db => { db.settings.cyc.day = v; });
  }
  else if (t.dataset && t.dataset.cyc) setCycle(t.dataset.mk, t.dataset.cyc, t.value);
  else if (id === 'dz-from') DZR.from = t.value;
  else if (id === 'dz-to') DZR.to = t.value;
  else if (t.matches && t.matches('input[type="checkbox"][data-day]')) {
    if (t.checked) DZSEL.add(t.dataset.day); else DZSEL.delete(t.dataset.day);
    const b = $('#dz-btn');
    if (b) { b.disabled = DZSEL.size === 0; b.textContent = dzLabel(); }
  } else if (id === 'import-file' && t.files && t.files[0]) importFile(t.files[0]);
});
/* Collage manuel du texte du raccourci dans le montant ou la description */
document.addEventListener('paste', e => {
  const id = e.target && e.target.id;
  if (!F || (id !== 'f-amount' && id !== 'f-desc')) return;
  const text = (e.clipboardData || window.clipboardData || { getData: () => '' }).getData('text');
  if (!/[|\n?]/.test(text)) return;
  const c = parseClip(text);
  if (!c) return;
  e.preventDefault();
  F.amount = numInput(c.cents);
  if (c.merchant) { F.desc = c.merchant; F.byUser = F.mode === 'edit' || F.mode === 'rec'; }
  const a = $('#f-amount'), d = $('#f-desc');
  if (a) { a.value = F.amount; fitAmount(a); }
  if (d) d.value = F.desc;
  commit(db => { db.meta.clip = true; db.meta.lastClip = text.slice(0, 300); }, { render: false });
  aiUpdate(false);
});
document.addEventListener('focusout', e => {
  if (e.target.id === 'f-amount' && F) {
    const c = parseAmount(F.amount);
    if (c && c > 0) { F.amount = numInput(c); e.target.value = F.amount; fitAmount(e.target); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'f-amount') { e.preventDefault(); const d = $('#f-desc'); if (d) d.focus(); }
  else if (e.target.id === 'f-desc' || e.target.id === 'f-day') { e.preventDefault(); e.target.blur(); }
  else if (['s-limit', 's-save'].includes(e.target.id)) e.target.blur();
  else if (e.target.id === 'm-amount') { e.preventDefault(); e.target.blur(); }
});

window.addEventListener('hashchange', () => { INTERNAL_NAV = true; render(); });
window.addEventListener('storage', e => { if (e.key === KEY || e.key === null) { DB = readDB(); HIDE = !!DB.settings.hide; invalidate(); softRender(); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') { HIDDEN_AT = Date.now(); return; }
  const away = HIDDEN_AT ? Date.now() - HIDDEN_AT : 0;
  if (away > 1500) markForeground();
  DB = readDB(); HIDE = !!DB.settings.hide; invalidate();
  if (away >= 180e3) PROMPT_PENDING = true;
  if (away >= 180e3 && DB.settings.open === 'pay' && !isFormRoute(route()) && $('#modal').hidden) {
    LAUNCH = true; F = null; FORM_KEY = null;
    location.replace('#/ajouter');
    return;
  }
  softRender();
});
window.addEventListener('pageshow', e => { if (e.persisted) { DB = readDB(); invalidate(); softRender(); } });
function scheduleMidnight() {
  const n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
  setTimeout(() => { softRender(); scheduleMidnight(); }, next - n);
}

/* =====================================================================
   14. Démarrage
   ===================================================================== */
function boot() {
  try { localStorage.setItem(KEY + '.test', '1'); localStorage.removeItem(KEY + '.test'); }
  catch (e) { STORAGE_OK = false; }
  DB = readDB();
  HIDE = !!DB.settings.hide;
  $$('[data-icon]').forEach(s => { s.outerHTML = ico(s.dataset.icon, Number(s.dataset.size) || 22); });
  const cap = readCapture();
  if (cap) {
    CAPTURE = cap;
    history.replaceState(null, '', location.pathname + '#/paiement');
  } else if (location.search && /(^|[?&])(amount|montant|merchant)=/i.test(location.search)) {
    history.replaceState(null, '', location.pathname + '#/');
  } else if (!location.hash) {
    if (DB.settings.open === 'pay') { LAUNCH = true; history.replaceState(null, '', location.pathname + '#/ajouter'); }
    else history.replaceState(null, '', location.pathname + location.search + '#/');
  }
  PROMPT_PENDING = true;
  markForeground();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitAmount($('#f-amount')));
  scheduleMidnight();
  if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

window.__sousous = { parseAmount, parseQuery, parseClip, predict, norm, clean, plan, monthSums, fixedSuggestions, frequents, fixedMatch, version: VERSION, get db() { return DB; } };

boot();
})();
</script>
</body>
</html>
