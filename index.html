<style>
:root {
  --bg: #0D0D0D;
  --card: #111A14;
  --card-2: #18231C;
  --line: rgba(255, 255, 255, .07);
  --line-2: rgba(255, 255, 255, .13);
  --pine: #0B3D1F;
  --pine-2: #11512A;
  --pine-3: #1A6B3A;
  --accent: #52C784;
  --text: #F2F5F3;
  --muted: #9AA49E;
  --faint: #848E88;
  --good: #43C576;
  --warn: #F2B33D;
  --crit: #F05A5A;
  --danger: #D93A3F;
  --font: -apple-system, BlinkMacSystemFont, system-ui, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --nav: 68px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: dark; background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; background: transparent; color: var(--text);
  font: 400 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
/* Halo vert sapin en haut d'écran : la couleur dominante sans éclaircir le fond */
body::before {
  content: ''; position: fixed; left: 0; right: 0; top: 0; height: 560px; z-index: -1; pointer-events: none;
  background: radial-gradient(110% 75% at 50% -8%, rgba(11, 61, 31, .95) 0%, rgba(11, 61, 31, .45) 42%, rgba(11, 61, 31, 0) 78%);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { display: block; flex: none; }

#app { max-width: 560px; margin: 0 auto; padding: calc(var(--st) + 12px) 18px calc(var(--nav) + var(--sb) + 28px); }
.is-form #app { padding-bottom: calc(var(--sb) + 130px); }

/* ---------- Typo ---------- */
.view-head { display: flex; align-items: center; gap: 10px; min-height: 52px; margin-bottom: 10px; }
.view-title { margin: 0; flex: 1; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
.view-title:focus { outline: none; }
.form-view .view-title { font-size: 18px; font-weight: 700; letter-spacing: 0; text-align: center; }
.head-spacer { width: 44px; flex: none; }
.h2 { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 750; letter-spacing: -.01em; }
.lab { display: block; font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.pos { color: var(--accent); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 2px 10px; }
.link { color: var(--accent); font-size: 15px; font-weight: 600; text-decoration: none; padding: 8px 0; }

/* ---------- Cartes ---------- */
.card { background: var(--card); border: 1px solid rgba(82, 199, 132, .09); border-radius: 20px; padding: 18px; }
.card + .card { margin-top: 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .card + .card { margin-top: 0; }
.stat { display: grid; align-content: start; gap: 6px; min-width: 0; text-decoration: none; color: inherit; padding: 16px 18px; }
.stat .val { font-size: 24px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.stat .val.cat { font-size: 19px; white-space: normal; overflow: visible; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
.stat .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Boutons ---------- */
.btn {
  appearance: none; border: 0; border-radius: 14px; min-height: 50px; padding: 0 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 16px; font-weight: 700; text-decoration: none; line-height: 1.1;
}
.btn-primary { background: linear-gradient(180deg, #145A31, var(--pine)); color: #fff; box-shadow: inset 0 0 0 1px rgba(82, 199, 132, .38), 0 8px 24px rgba(11, 61, 31, .45); }
.btn-ghost { background: var(--card-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-text { background: none; color: var(--muted); min-height: 46px; font-weight: 650; }
.btn-text.danger { color: var(--crit); }
.btn-block { width: 100%; }
.btn-small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.icon-btn { appearance: none; border: 0; background: none; color: var(--text); width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.icon-btn:disabled { opacity: .25; }
.icon-btn.round { background: var(--card-2); border-radius: 50%; }

/* ---------- En-tête ---------- */
.top { display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
.brand .logo svg { width: 36px; height: 36px; display: block; }
.date { color: var(--muted); font-size: 15px; }
.alert { margin: 10px 0 0; padding: 12px 14px; border-radius: 14px; background: rgba(242, 179, 61, .12); color: var(--warn); font-size: 14px; }

/* ---------- Jauge ---------- */
.hero { display: grid; justify-items: center; padding: 4px 0 18px; }
.gauge { width: min(320px, 84vw); cursor: pointer; border-radius: 50%; }
.gauge-svg { display: block; width: 100%; height: auto; overflow: visible; }
.seg { stroke-width: 8; stroke-linecap: round; }
.st-good .seg { stroke: #123A22; } .st-good .seg.on { stroke: var(--good); }
.st-warn .seg { stroke: #3A2D0F; } .st-warn .seg.on { stroke: var(--warn); }
.st-crit .seg { stroke: #3F1616; } .st-crit .seg.on { stroke: var(--crit); }
.ovr { stroke-width: 3.5; stroke-linecap: round; stroke: #2E1212; } .ovr.on { stroke: var(--crit); }
.g-amt { fill: var(--text); font-family: var(--font); font-weight: 800; letter-spacing: -.02em; }

.mode { margin: 6px 0 0; color: var(--muted); font-size: 14px; text-align: center; }

/* ---------- Répartition ---------- */
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 8.5em) 1fr auto; align-items: center; gap: 12px; min-height: 36px; color: inherit; text-decoration: none; }
.bar-name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.bar-row.is-top .bar-name { color: var(--text); font-weight: 650; }
.bar-track { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .05); position: relative; overflow: hidden; }
.bar-fill { position: absolute; inset: 0 auto 0 0; min-width: 4px; border-radius: 4px; background: rgba(255, 255, 255, .22); }
.bar-val { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.bar-row.is-top .bar-val { color: var(--text); }

/* ---------- Listes ---------- */
.list { list-style: none; margin: 0; padding: 4px 0; }
.card.list { padding: 2px 0; }
.tx { display: flex; align-items: center; }
.tx + .tx { border-top: 1px solid var(--line); }
.tx-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 4px 12px 16px; color: inherit; text-decoration: none; }
.tx-main { flex: 1; min-width: 0; display: grid; }
.tx-title { font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-amt { font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx-amt.pos { color: var(--accent); }
.tx-del { appearance: none; border: 0; background: none; color: var(--crit); width: 48px; height: 48px; display: grid; place-items: center; margin-right: 6px; border-radius: 12px; opacity: .85; }
.tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: #fff; background: var(--c, #898781); }
.tile.sm { width: 28px; height: 28px; border-radius: 9px; }
.tile.big { width: 56px; height: 56px; border-radius: 16px; }
.day-head { display: flex; justify-content: space-between; gap: 12px; margin: 22px 4px 8px; font-size: 14px; font-weight: 650; color: var(--muted); }
.day-head:first-child { margin-top: 6px; }
.empty { text-align: center; padding: 26px 18px; color: var(--muted); }
.empty p { margin: 0 0 14px; }

/* ---------- Historique ---------- */
.month-bar { display: flex; align-items: center; justify-content: space-between; margin: 0 -6px 12px; }
.month-bar .h2 { font-size: 19px; }
.search { position: relative; margin: 14px 0 10px; }
.search .input { padding-left: 44px; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.chips-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 18px 6px; margin: 0 -18px 4px; scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--card-2); color: var(--muted); font-size: 14px; font-weight: 600; }
.pill.on { background: var(--pine); color: #fff; box-shadow: inset 0 0 0 1px rgba(82, 199, 132, .45); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

/* ---------- Formulaires ---------- */
.field { display: grid; gap: 8px; margin: 0 0 18px; border: 0; padding: 0; min-width: 0; }
.flabel { font-size: 13px; font-weight: 650; color: var(--muted); padding: 0; }
.input {
  width: 100%; min-height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--card-2);
  color: var(--text); padding: 12px 14px; font-size: 16px; line-height: 1.2; -webkit-appearance: none; appearance: none;
}
.input::placeholder { color: var(--faint); }

.ai { display: flex; align-items: center; gap: 10px; min-height: 50px; margin: -6px 0 16px; padding: 6px 8px 6px 14px; border-radius: 14px; background: rgba(11, 61, 31, .45); box-shadow: inset 0 0 0 1px rgba(82, 199, 132, .22); font-size: 15px; }

.ai .ic { color: var(--accent); }

.ai-pct { color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }

/* ---------- Catégories ---------- */
.list-head { display: flex; justify-content: space-between; margin: 22px 6px 8px; }

.switch[aria-checked="true"] span { transform: translateX(20px); background: #fff; }
.switch-field { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.cat-preview { display: flex; align-items: center; gap: 14px; margin: 6px 0 22px; }
.cat-preview-name { font-size: 22px; font-weight: 750; overflow-wrap: anywhere; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.icon-opt { height: 48px; border: 0; border-radius: 12px; background: var(--card-2); color: var(--muted); display: grid; place-items: center; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--c); }

.row.danger, .row.danger .ic:first-child { color: var(--crit); }

.help p { margin: 0; color: var(--muted); font-size: 15px; }

.modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .66); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }

/* Montant tolérant : "12.50", "12,50 €", "€12.50", "1 234,56", "1,234.56" -> centimes */
function parseAmount(raw) {
  if (raw == null) return null;
  let s = safeDecode(String(raw)).trim();
  if (!s) return null;
  s = s.replace(/[\s\u00A0\u202F\u2009\u2007'’]/g, '').replace(/[^0-9.,-]/g, '').replace(/-/g, '');
  if (!/\d/.test(s)) return null;
  const sepIdx = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
  let intPart = s, frac = '';
  if (sepIdx > -1) {
    const sep = s[sepIdx], other = sep === ',' ? '.' : ',';
    const before = s.slice(0, sepIdx), after = s.slice(sepIdx + 1);
    const count = s.split(sep).length - 1;
    let decimal;
    if (s.includes(other)) decimal = true;
    else if (count > 1) decimal = false;
    else decimal = !(after.length === 3 && /^\d{1,3}$/.test(before) && before !== '0');
    if (decimal) { intPart = before.replace(/[.,]/g, ''); frac = after.replace(/[.,]/g, ''); }
    else intPart = s.replace(/[.,]/g, '');
  }
  if (!intPart) intPart = '0';
  if (!/^\d+$/.test(intPart) || (frac && !/^\d+$/.test(frac))) return null;
  const cents = Number(intPart) * 100 + Math.round(Number('0.' + (frac || '0')) * 100);
  return Number.isFinite(cents) ? cents : null;
}

function defaults() {

function sanitize(d) {
  const base = defaults();
  if (!d || typeof d !== 'object') return base;
  const out = { v: 2, tx: [], cats: [], settings: Object.assign({}, base.settings), meta: Object.assign({}, base.meta) };
  if (Array.isArray(d.cats)) {
    const seen = new Set();
    for (const c of d.cats) {
      if (!c || typeof c.id !== 'string' || !c.id || seen.has(c.id) || typeof c.name !== 'string' || !c.name.trim()) continue;
      seen.add(c.id);
      out.cats.push({
        id: c.id.slice(0, 40), name: c.name.trim().slice(0, 28),
        icon: CAT_ICONS.includes(c.icon) ? c.icon : 'star',
        color: Number.isInteger(c.color) && c.color >= -1 && c.color < PALETTE.length ? c.color : -1,
        budget: c.id === INCOME ? false : c.budget !== false,
        kw: Array.isArray(c.kw) ? c.kw.filter(k => typeof k === 'string' && k.trim()).map(k => k.trim().slice(0, 40)).slice(0, 40) : [],
        builtin: !!c.builtin
      });
    }
  }
  if (!out.cats.length) out.cats = base.cats;
  for (const id of ['autres', INCOME]) {
    if (!out.cats.some(c => c.id === id)) out.cats.push(Object.assign({}, DEFAULT_CATS.find(c => c.id === id), { kw: [] }));
  }
  const catIds = new Set(out.cats.map(c => c.id));
  if (Array.isArray(d.tx)) {
    const seen = new Set();
    for (const t of d.tx) {
      if (!t || typeof t.id !== 'string' || !t.id || seen.has(t.id)) continue;
      const a = Math.round(Number(t.a));
      if (!Number.isFinite(a) || a <= 0 || a > 1e10) continue;
      if (typeof t.d !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(t.d)) continue;
      seen.add(t.id);
      const ts = Number(t.t);
      const cat = catIds.has(t.cat) ? t.cat : 'autres';
      const o = {
        id: t.id, a, d: t.d,
        t: Number.isFinite(ts) && ts > 0 ? ts : dateOf(t.d).getTime() + 12 * 3600e3,
        desc: typeof t.desc === 'string' ? t.desc.slice(0, 120) : '',
        cat, src: t.src === 'applepay' ? 'applepay' : 'manual',
        p: typeof t.p === 'string' ? t.p : null
      };
      if (cat === INCOME && t.rec) o.rec = true;
      out.tx.push(o);
    }
  }
  const s = d.settings || {};
  out.settings.mode = s.mode === 'income' ? 'income' : 'manual';
  const lim = Math.round(Number(s.limit));
  if (Number.isFinite(lim) && lim > 0) out.settings.limit = lim;
  const m = d.meta || {};
  if (Number.isFinite(m.created)) out.meta.created = m.created;
  if (Number.isFinite(m.lastExport)) out.meta.lastExport = m.lastExport;
  return out;
}

  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { STORAGE_OK = false; toast('Enregistrement impossible : stockage indisponible ou plein.'); return false; }
}
function commit(fn, opts) {

  writeDB(fresh);

const catMap = () => new Map(DB.cats.map(c => [c.id, c]));
const catById = id => DB.cats.find(c => c.id === id) || DB.cats.find(c => c.id === 'autres') || DB.cats[0];
const isIn = t => t.cat === INCOME;
const inBudget = (t, cm) => { if (isIn(t)) return false; const c = cm.get(t.cat); return c ? c.budget !== false : true; };
const byRecent = (a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : b.t - a.t);
const expenseCats = () => DB.cats.filter(c => c.id !== INCOME);

/* =====================================================================
   6. Budget et rentrées
   ===================================================================== */
function daySum(k, budgetOnly) {
  const cm = catMap();
  let s = 0;
  for (const t of DB.tx) if (t.d === k && !isIn(t) && (!budgetOnly || inBudget(t, cm))) s += t.a;
  return s;
}
/* Rentrées d'un mois : ponctuelles du mois + mensuelles démarrées ce mois-ci ou avant */
function monthIncome(y, m) {
  const mk = monthKey(y, m);
  let s = 0;
  const items = [];
  for (const t of DB.tx) {
    if (!isIn(t)) continue;
    const tk = t.d.slice(0, 7);
    if (t.rec ? tk <= mk : tk === mk) { s += t.a; items.push(t); }
  }
  return { s, items };
}
function monthStats(y, m) {
  const pre = monthKey(y, m), by = new Map();
  let total = 0, n = 0;
  for (const t of DB.tx) if (!isIn(t) && t.d.startsWith(pre)) { total += t.a; n++; by.set(t.cat, (by.get(t.cat) || 0) + t.a); }
  return { total, n, ranked: [...by].sort((a, b) => b[1] - a[1]) };
}
/* Mode « selon mes rentrées » : (rentrées du mois - dépenses déjà faites ce mois, avant aujourd'hui) / jours restants */
function incomeInfo() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), t = today(), pre = monthKey(y, m);
  const inc = monthIncome(y, m).s;
  let spentBefore = 0;
  for (const x of DB.tx) if (!isIn(x) && x.d.startsWith(pre) && x.d < t) spentBefore += x.a;
  const daysLeft = new Date(y, m + 1, 0).getDate() - now.getDate() + 1;
  const left = inc - spentBefore;
  return { inc, spentBefore, daysLeft, left, limit: Math.max(0, Math.floor(left / daysLeft)), ok: inc > 0 };
}
function currentLimit() {
  if (DB.settings.mode === 'income') {
    const i = incomeInfo();
    return i.ok ? { cents: i.limit, kind: 'income', i } : { cents: DB.settings.limit, kind: 'fallback', i };
  }
  return { cents: DB.settings.limit, kind: 'manual' };
}

/* =====================================================================
   7. IA locale : bibliothèque + historique + montant/heure
   ===================================================================== */
let MODEL = null, LIBIDX = null;
function invalidate() { MODEL = null; LIBIDX = null; }

function libIndex() {
  if (LIBIDX) return LIBIDX;
  const valid = new Set(DB.cats.map(c => c.id));
  const list = [];
  const push = (raw, cat, user) => { const kw = clean(norm(raw)); if (kw && kw.length >= 2) list.push({ kw, cat, user }); };
  for (const cat of Object.keys(LIB)) if (valid.has(cat)) LIB[cat].split(',').forEach(k => push(k, cat, false));
  for (const c of DB.cats) {
    for (const w of norm(c.name).split(' ')) if (w.length >= 4 && !STOP.has(w)) push(w, c.id, !c.builtin);
    for (const k of c.kw || []) push(k, c.id, true);
  }
  list.sort((a, b) => b.kw.length - a.kw.length || (b.user - a.user));
  return (LIBIDX = { list, singles: list.filter(e => e.kw.indexOf(' ') < 0 && e.kw.length >= 5) });
}
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = [];
  for (let j = 0; j <= b.length; j++) prev.push(j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      cur.push(v);
      if (v < rowMin) rowMin = v;
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function libMatch(c, typing, skip) {
  if (!c) return null;
  const { list, singles } = libIndex();
  const ok = e => !skip || e.cat !== skip;
  const padded = ' ' + c + ' ';
  for (const e of list) if (ok(e) && padded.indexOf(' ' + e.kw + ' ') > -1) return { cat: e.cat, kw: e.kw, kind: 'mot', w: e.user ? 1.5 : 1.2 };
  const toks = c.split(' ');
  const last = typing ? toks[toks.length - 1] : '';
  if (last.length >= 3) {
    let best = null;
    for (const e of list) {
      if (!ok(e)) continue;
      const f = e.kw.split(' ')[0];
      if (f.length > last.length && f.startsWith(last) && (!best || e.user > best.user || (e.user === best.user && e.kw.length < best.kw.length))) best = e;
    }
    if (best) return { cat: best.cat, kw: best.kw, kind: 'debut', w: best.user ? 1.0 : 0.8 };
  }
  let bf = null;
  for (const t of toks) {
    if (t.length < 5) continue;
    const max = t.length >= 8 ? 2 : 1;
    for (const e of singles) {
      if (!ok(e) || Math.abs(e.kw.length - t.length) > max) continue;
      const dist = lev(t, e.kw, max);
      if (dist <= max && (!bf || dist < bf.dist || (dist === bf.dist && e.kw.length > bf.e.kw.length))) bf = { e, dist };
    }
  }
  return bf ? { cat: bf.e.cat, kw: bf.e.kw, kind: 'approx', w: 0.7 } : null;
}
function model() {
  if (MODEL) return MODEL;
  const now = Date.now(), HALF = 120 * 864e5;
  const valid = new Set(DB.cats.map(c => c.id));
  const exact = new Map(), exactN = new Map(), tok = new Map(), pts = [];
  const bump = (map, k, cat, w) => { let m = map.get(k); if (!m) map.set(k, (m = new Map())); m.set(cat, (m.get(cat) || 0) + w); };
  for (const t of DB.tx) {
    if (!valid.has(t.cat)) continue;
    const w = Math.pow(0.5, Math.max(0, now - t.t) / HALF);
    const c = clean(norm(t.desc));
    if (c) {
      bump(exact, c, t.cat, w);
      exactN.set(c, (exactN.get(c) || 0) + 1);
      for (const k of new Set(c.split(' '))) if (k.length >= 3 && !STOP.has(k)) bump(tok, k, t.cat, w);
    }
    if (!isIn(t)) pts.push({ la: Math.log1p(t.a / 100), h: new Date(t.t).getHours(), cat: t.cat, w });
  }
  return (MODEL = { exact, exactN, tok, pts, valid });
}
/* opts.noIncome : un paiement par carte n'est jamais une rentrée */
function predict(desc, cents, typing, opts) {
  const M = model();
  const skip = opts && opts.noIncome ? INCOME : null;
  const c = clean(norm(desc));
  const S = new Map(), SRC = new Map();
  const add = (cat, v, src) => {
    if (!(v > 0) || !M.valid.has(cat) || cat === skip) return;
    S.set(cat, (S.get(cat) || 0) + v);
    const o = SRC.get(cat) || { hist: 0, lib: 0, amt: 0 };
    o[src] += v;
    SRC.set(cat, o);
  };
  let lib = null, exN = 0;
  if (c) {
    const ex = M.exact.get(c);
    if (ex) {
      let tot = 0;
      for (const w of ex.values()) tot += w;
      const conf = tot / (tot + 0.6);
      for (const [cat, w] of ex) add(cat, 3 * conf * w / tot, 'hist');
      exN = M.exactN.get(c) || 0;
    }
    const votes = new Map();
    let wsum = 0;
    for (const k of new Set(c.split(' '))) {
      if (k.length < 3 || STOP.has(k)) continue;
      const d = M.tok.get(k);
      if (!d) continue;
      let tot = 0, max = 0;
      for (const w of d.values()) tot += w;
      for (const w of d.values()) max = Math.max(max, w / tot);
      const weight = max * tot / (tot + 1);
      for (const [cat, w] of d) votes.set(cat, (votes.get(cat) || 0) + weight * w / tot);
      wsum += weight;
    }
    for (const [cat, v] of votes) add(cat, 1.6 * v / Math.max(1, wsum), 'hist');
    lib = libMatch(c, typing, skip);
    if (lib) add(lib.cat, lib.w, 'lib');
  }
  if (!S.size && cents > 0 && M.pts.length >= 4) {
    const la = Math.log1p(cents / 100), h = new Date().getHours();
    const votes = new Map();
    let tot = 0;
    for (const p of M.pts) {
      const da = (p.la - la) / 0.22;
      let dh = Math.abs(p.h - h);
      dh = Math.min(dh, 24 - dh) / 3;
      const k = p.w * Math.exp(-0.5 * (da * da + dh * dh));
      if (k < 1e-3) continue;
      votes.set(p.cat, (votes.get(p.cat) || 0) + k);
      tot += k;
    }
    if (tot > 0.05) {
      const conf = tot / (tot + 1);
      for (const [cat, v] of votes) add(cat, conf * v / tot, 'amt');
    }
  }
  if (!S.size) return null;
  let total = 0;
  for (const v of S.values()) total += v;
  const ranked = [...S].sort((a, b) => b[1] - a[1]);
  const [cat, score] = ranked[0];
  const o = SRC.get(cat);
  const source = o.hist >= o.lib && o.hist >= o.amt ? 'hist' : (o.lib >= o.amt ? 'lib' : 'amt');
  const conf = Math.min(0.99, (score / total) * Math.min(1, score / 1.4));
  if (conf < (source === 'amt' ? 0.2 : 0.15)) return null;
  return { cat, conf, source, lib, exN };
}

/* Jauge segmentée : 36 segments sur 270°, anneau intérieur si dépassement */
let GAUGE_SWEPT = false, LAST_LIT = null;
function gaugeSVG(spent, limit) {
  const N = 36, cx = 160, cy = 158, r1 = 122, r2 = 142;
  const ratio = limit > 0 ? spent / limit : (spent > 0 ? 2 : 0);
  const st = ratio > 1 ? 'crit' : ratio >= 0.8 ? 'warn' : 'good';
  const lit = spent > 0 ? Math.max(1, Math.min(N, Math.round(Math.min(1, ratio) * N))) : 0;
  const over = ratio > 1 ? Math.max(1, Math.min(N, Math.round(Math.min(1, ratio - 1) * N))) : 0;
  let segs = '', ovr = '';
  for (let i = 0; i < N; i++) {
    const a = (135 + (i + 0.5) * 270 / N) * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
    segs += '<line class="seg' + (i < lit ? ' on' : '') + '" x1="' + (cx + r1 * co).toFixed(1) + '" y1="' + (cy + r1 * si).toFixed(1) +
      '" x2="' + (cx + r2 * co).toFixed(1) + '" y2="' + (cy + r2 * si).toFixed(1) + '"/>';
    if (over) ovr += '<line class="ovr' + (i < over ? ' on' : '') + '" x1="' + (cx + 108 * co).toFixed(1) + '" y1="' + (cy + 108 * si).toFixed(1) +
      '" x2="' + (cx + 113 * co).toFixed(1) + '" y2="' + (cy + 113 * si).toFixed(1) + '"/>';
  }
  const amt = money(spent);
  const size = Math.min(52, Math.floor(196 / (amt.length * 0.6)));
  const p = limit > 0 ? Math.round(100 * spent / limit) : (spent > 0 ? 100 : 0);
  return '<svg class="gauge-svg st-' + st + '" viewBox="0 0 320 290" aria-hidden="true" data-lit="' + lit + '">' +
    '<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/>' +
    '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
    '<g class="segs" filter="url(#glow)">' + segs + '</g>' +
    (over ? '<g filter="url(#glow)">' + ovr + '</g>' : '') +
    '<text class="g-pct" x="160" y="112" text-anchor="middle">' + esc(pct(p)) + '</text>' +
    '<text class="g-amt" x="160" y="' + (150 + size * 0.36).toFixed(0) + '" text-anchor="middle" font-size="' + size + '">' + esc(amt) + '</text>' +
    '<text class="g-sub" x="160" y="' + (182 + size * 0.36).toFixed(0) + '" text-anchor="middle">sur ' + esc(money(limit)) + '</text>' +
    '<text class="g-end" x="84" y="282" text-anchor="middle">0</text>' +
    '<text class="g-end" x="236" y="282" text-anchor="middle">' + esc(moneyShort(limit)) + '</text>' +
    '</svg>';
}
/* Balayage à l'ouverture, puis seuls les nouveaux segments s'animent après un ajout */
function sweepGauge() {
  const svg = $('.gauge-svg');
  if (!svg) return;
  const lit = Number(svg.dataset.lit) || 0;
  const from = GAUGE_SWEPT ? LAST_LIT : 0;
  GAUGE_SWEPT = true;
  LAST_LIT = lit;
  if (from == null || lit <= from) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const segs = $$('.seg', svg), span = lit - from;
  segs.forEach((s, i) => s.classList.toggle('on', i < from));
  const t0 = performance.now(), dur = 380 + span * 14;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3), n = from + Math.round(e * span);
    segs.forEach((s, i) => s.classList.toggle('on', i < n));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function modal(o) {
  return new Promise(resolve => {
    const root = $('#modal');
    const cancel = o.cancel !== false ? '<button type="button" class="btn btn-ghost" data-m="cancel">' + esc(o.cancel || 'Annuler') + '</button>' : '';
    const ok = '<button type="button" class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-m="ok"' + (o.typed ? ' disabled' : '') + '>' + esc(o.confirm || 'Confirmer') + '</button>';
    root.innerHTML = '<div class="modal-backdrop" data-m="cancel"></div>' +
      '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="m-title">' +
      '<h2 id="m-title" class="h2">' + esc(o.title) + '</h2><div class="modal-body">' + (o.body || '') + '</div>' +
      (o.typed ? '<input class="input" id="m-typed" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Confirmation" placeholder="' + esc(o.typed) + '">' : '') +
      '<div class="modal-actions' + (o.stack ? ' stack' : '') + '">' + (o.stack ? ok + cancel : cancel + ok) + '</div></div>';
    typoDom(root);
    root.hidden = false;
    const prev = document.activeElement;
    const onKey = e => { if (e.key === 'Escape') close(false); };
    const close = v => {
      root.hidden = true; root.innerHTML = ''; root.onclick = null;
      document.removeEventListener('keydown', onKey);
      if (prev && prev.focus && document.contains(prev)) prev.focus({ preventScroll: true });
      resolve(v);
    };
    document.addEventListener('keydown', onKey);
    root.onclick = e => {
      const b = e.target.closest('[data-m]');
      if (!b || b.disabled) return;
      close(b.dataset.m === 'ok');
    };
    if (o.typed) {
      const inp = $('#m-typed'), okb = root.querySelector('[data-m="ok"]');
      inp.oninput = () => { okb.disabled = inp.value.trim().toLowerCase() !== o.typed.toLowerCase(); };
      setTimeout(() => inp.focus(), 40);
    } else setTimeout(() => { const b = root.querySelector('[data-m="ok"]'); if (b) b.focus(); }, 40);
  });
}

/* ---------- Historique ---------- */
let HIST = null;
/* Entrées d'un mois : réelles + rentrées mensuelles reportées (jour d'origine) */
function monthEntries(y, m) {
  const mk = monthKey(y, m), out = [];
  const dim = new Date(y, m + 1, 0).getDate();
  for (const t of DB.tx) {
    if (t.rec) {
      const tk = t.d.slice(0, 7);
      if (tk > mk) continue;
      if (tk === mk) { out.push(t); continue; }
      const day = Math.min(dim, Number(t.d.slice(8)));
      const d = mk + '-' + pad(day);
      if (d > today()) continue;
      out.push(Object.assign({}, t, { d, t: dateOf(d).getTime() + (t.t % 864e5) }));
    } else if (t.d.startsWith(mk)) out.push(t);
  }
  return out;
}
function histList() {
  const q = clean(norm(HIST.q)), cm = catMap();
  return monthEntries(HIST.y, HIST.m).filter(t => (!HIST.c || t.cat === HIST.c) &&
    (!q || (norm(t.desc) + ' ' + norm((cm.get(t.cat) || {}).name)).indexOf(q) > -1)).sort(byRecent);
}
function histBody(list) {
  if (!list.length) return '<div class="card empty"><p>' + (HIST.q || HIST.c ? 'Aucun résultat.' : 'Aucune entrée ce mois-ci.') + '</p></div>';
  const cm = catMap(), groups = new Map();
  for (const t of list) { if (!groups.has(t.d)) groups.set(t.d, []); groups.get(t.d).push(t); }
  let html = '';
  for (const [d, arr] of groups) {
    const out = arr.filter(t => !isIn(t)).reduce((s, t) => s + t.a, 0);
    html += '<h3 class="day-head"><span>' + esc(dayLabel(d)) + '</span><span>' + (out ? money(out) : '') + '</span></h3>' +
      '<ul class="card list">' + arr.map(t => txRowHTML(t, cm, false)).join('') + '</ul>';
  }
  return html;
}
function histSums(list) {
  let o = 0, i = 0;
  for (const t of list) if (isIn(t)) i += t.a; else o += t.a;
  return { o, i };
}
function viewHistory(r) {
  const now = new Date();
  if (!HIST) HIST = { y: now.getFullYear(), m: now.getMonth(), c: '', q: '' };
  const pm = r.q.get('m'), pc = r.q.get('c');
  if (pm || pc != null) {
    if (pm && /^\d{4}-\d{2}$/.test(pm)) { HIST.y = Number(pm.slice(0, 4)); HIST.m = Number(pm.slice(5)) - 1; }
    else { HIST.y = now.getFullYear(); HIST.m = now.getMonth(); }
    HIST.c = pc && DB.cats.some(c => c.id === pc) ? pc : '';
    HIST.q = '';
    history.replaceState(null, '', '#/historique');
  }
  if (HIST.c && !DB.cats.some(c => c.id === HIST.c)) HIST.c = '';
  const isCur = HIST.y === now.getFullYear() && HIST.m === now.getMonth();
  const list = histList(), s = histSums(list);
  return '<header class="view-head"><h1 class="view-title" tabindex="-1">Historique</h1></header>' +
    '<div class="month-bar">' +
    '<button class="icon-btn" type="button" data-act="hist-month" data-d="-1" aria-label="Mois précédent">' + ico('chevL', 22) + '</button>' +
    '<h2 class="h2">' + esc(monthLabel(HIST.y, HIST.m)) + '</h2>' +
    '<button class="icon-btn" type="button" data-act="hist-month" data-d="1" aria-label="Mois suivant"' + (isCur ? ' disabled' : '') + '>' + ico('chevR', 22) + '</button></div>' +
    '<div class="grid2"><div class="card stat"><span class="lab">Dépensé</span><span class="val" id="h-out">' + money(s.o) + '</span></div>' +
    '<div class="card stat"><span class="lab">Rentrées</span><span class="val pos" id="h-in">' + money(s.i) + '</span></div></div>' +
    '<div class="search">' + ico('search', 20) + '<input id="h-search" class="input" type="search" placeholder="Rechercher" autocomplete="off" aria-label="Rechercher" value="' + esc(HIST.q) + '"></div>' +
    '<div class="chips-row" role="group" aria-label="Filtrer par catégorie">' +
    '<button type="button" class="pill' + (!HIST.c ? ' on' : '') + '" data-act="hist-cat" data-cat="" aria-pressed="' + !HIST.c + '">Tout</button>' +
    DB.cats.map(c => '<button type="button" class="pill' + (HIST.c === c.id ? ' on' : '') + '" data-act="hist-cat" data-cat="' + esc(c.id) + '" aria-pressed="' + (HIST.c === c.id) + '">' +
      '<span class="dot" style="--c:' + colorOf(c) + '"></span>' + esc(c.name) + '</button>').join('') +

let FIT_CTX = null;
function fitAmount(el) {
  if (!el) return;
  const v = el.value || el.placeholder || '';
  try {
    if (!FIT_CTX) FIT_CTX = document.createElement('canvas').getContext('2d');
    el.style.fontSize = '';
    const cs = getComputedStyle(el), base = parseFloat(cs.fontSize) || 56;
    const measure = size => {
      FIT_CTX.font = cs.fontWeight + ' ' + size + 'px ' + cs.fontFamily;
      if ('letterSpacing' in FIT_CTX) FIT_CTX.letterSpacing = (-0.03 * size) + 'px';
      return FIT_CTX.measureText(v).width * 1.02 + size * 0.08;
    };
    const avail = (el.parentNode ? el.parentNode.clientWidth : 300) - 46;
    let size = base, w = measure(size);
    if (w > avail && avail > 0) { size = Math.max(24, Math.floor(base * avail / w)); el.style.fontSize = size + 'px'; w = measure(size); }
    el.style.width = Math.ceil(w) + 'px';
  } catch (e) {
    el.style.width = (Math.max(2, v.length) + 0.7) + 'ch';
  }
}

function saveForm() {
  const cents = parseAmount(F.amount);
  if (!cents || cents <= 0) return formError('Entre un montant supérieur à 0 €.', 'f-amount');
  if (cents > 100000000) return formError('Montant trop élevé : 1 000 000 € maximum.', 'f-amount');
  if (!F.cat || !DB.cats.some(c => c.id === F.cat)) return formError('Choisis une catégorie.');
  const date = /^\d{4}-\d{2}-\d{2}$/.test(F.date) ? F.date : today();
  const desc = F.desc.trim().slice(0, 120);
  const mode = F.mode, id = F.id, cat = F.cat, rec = cat === INCOME && !!F.rec, predicted = F.pred ? F.pred.cat : null;
  if (mode === 'edit') {
    commit(db => {
      const t = db.tx.find(x => x.id === id);
      if (!t) return;
      if (t.d !== date) {
        const old = new Date(t.t), d = dateOf(date);
        d.setHours(old.getHours(), old.getMinutes(), old.getSeconds());
        t.t = d.getTime();
        t.d = date;
      }
      t.a = cents; t.desc = desc; t.cat = cat;
      if (rec) t.rec = true; else delete t.rec;
    }, { render: false });
    toast('Modification enregistrée');
  } else {
    const now = new Date();
    let ts = now.getTime();
    if (date !== today()) { const d = dateOf(date); d.setHours(now.getHours(), now.getMinutes(), now.getSeconds()); ts = d.getTime(); }
    commit(db => {
      const o = { id: uid(), a: cents, d: date, t: ts, desc, cat, src: mode === 'pay' ? 'applepay' : 'manual', p: predicted };
      if (rec) o.rec = true;
      db.tx.push(o);
    }, { render: false });
    toast(cat === INCOME ? 'Rentrée ajoutée : ' + money(cents) : (mode === 'pay' ? 'Paiement enregistré : ' : 'Dépense ajoutée : ') + money(cents));
    askPersist();
  }
  F = null; FORM_KEY = null;
  if (mode === 'edit') goBack(); else location.replace('#/');
}

async function removeTx(id) {
  const tx = DB.tx.find(t => t.id === id);
  if (!tx) return;
  if (tx.rec) {
    const ok = await modal({ title: 'Supprimer « ' + (tx.desc || 'cette rentrée') + ' » ?', body: '<p>Rentrée mensuelle : elle disparaîtra de tous les mois.</p>', confirm: 'Supprimer', danger: true });
    if (!ok) return false;
  }
  let removed = null;
  commit(db => { const i = db.tx.findIndex(t => t.id === id); if (i > -1) removed = db.tx.splice(i, 1)[0]; });
  if (!removed) return false;
  toast(isIn(removed) ? 'Rentrée supprimée' : 'Dépense supprimée', {
    action: 'Annuler', timeout: 6000,
    onAction: () => commit(db => { if (!db.tx.some(t => t.id === removed.id)) db.tx.push(removed); })
  });
  return true;
}

async function shareOrDownload(blob, name) {
  try {
    const file = new File([blob], name, { type: blob.type });
    const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
async function exportJSON() {
  const data = { app: 'sousous', version: VERSION, exportedAt: new Date().toISOString(), db: DB };
  const done = await shareOrDownload(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), 'sousous-' + today() + '.json');
  if (done) { commit(db => { db.meta.lastExport = Date.now(); }, { render: false }); toast('Données exportées'); }
}
async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { toast("Fichier illisible : ce n'est pas un JSON valide."); return; }
  const src = data && data.db ? data.db : data;
  if (!src || !Array.isArray(src.tx)) { toast("Ce fichier n'est pas une sauvegarde Sousous."); return; }
  const inc = sanitize(src);

  commit(db => { db.tx = inc.tx; db.cats = inc.cats; db.settings = inc.settings; db.meta = Object.assign({}, inc.meta, { lastExport: db.meta.lastExport }); });
  toast('Import terminé');
}

/* =====================================================================
   11. Capture depuis l'URL (?amount=12.50&merchant=Uber)
   ===================================================================== */
const CAP_KEYS = ['amount', 'montant', 'merchant', 'marchand', 'commercant', 'description', 'desc', 'label', 'category', 'categorie', 'cat', 'date'];
/* Analyse manuelle : un commerçant non encodé avec « & » ou des espaces reste lisible */
function parseQuery(search) {
  const s = (search || '').replace(/^\?/, '');
  const out = {};
  if (!s) return out;
  const re = new RegExp('(^|&)(' + CAP_KEYS.join('|') + ')=', 'gi');
  const hits = [];
  let m;
  while ((m = re.exec(s))) hits.push({ key: m[2].toLowerCase(), start: m.index, val: re.lastIndex });
  hits.forEach((h, i) => {
    const end = i + 1 < hits.length ? hits[i + 1].start : s.length;
    out[h.key] = safeDecode(s.slice(h.val, end).replace(/\+/g, ' ')).trim();
  });
  return out;
}
function readCapture() {
  const q = parseQuery(location.search);
  const pick = (...keys) => { for (const k of keys) if (q[k] != null) return q[k]; return null; };
  const amountRaw = pick('amount', 'montant');
  let merchant = pick('merchant', 'marchand', 'commercant', 'description', 'desc', 'label') || '';
  if (/^(commercant|commerçant|merchant)$/i.test(merchant)) merchant = '';
  if (amountRaw == null && !merchant) return null;
  const cents = amountRaw != null && !/^montant$/i.test(amountRaw) ? parseAmount(amountRaw) : null;
  let cat = null;
  const cq = pick('category', 'categorie', 'cat');
  if (cq) { const n = norm(cq); const c = DB.cats.find(x => x.id !== INCOME && (x.id === cq || norm(x.name) === n)); if (c) cat = c.id; }
  const date = q.date && /^\d{4}-\d{2}-\d{2}$/.test(q.date) ? q.date : null;
  return { amountRaw: amountRaw || '', cents: cents && cents > 0 ? cents : null, merchant: merchant.slice(0, 120), cat, date };
}

   ===================================================================== */
const ROUTES = { '': viewHome, historique: viewHistory, ajouter: viewForm, modifier: viewForm, paiement: viewForm, categories: viewCategories, reglages: viewSettings, aide: viewHelp, effacer: viewErase };
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const qi = h.indexOf('?');
  const path = qi > -1 ? h.slice(0, qi) : h, qs = qi > -1 ? h.slice(qi + 1) : '';
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || '', arg: parts[1] ? safeDecode(parts[1]) : null, q: new URLSearchParams(qs) };
}
const isFormRoute = r => ['ajouter', 'modifier', 'paiement', 'effacer'].includes(r.name) || (r.name === 'categories' && !!r.arg);
const TAB_OF = { '': '', historique: 'historique', categories: 'categories', reglages: 'reglages', aide: 'reglages' };

let LAST_KEY = null;
function render() {
  const r = route();
  const fn = Object.prototype.hasOwnProperty.call(ROUTES, r.name) ? ROUTES[r.name] : viewHome;
  if (!['ajouter', 'modifier', 'paiement'].includes(r.name)) { F = null; FORM_KEY = null; }
  if (!(r.name === 'categories' && r.arg)) { CF = null; CF_KEY = null; }
  const html = fn(r);
  if (html == null) return;
  document.body.classList.toggle('is-form', isFormRoute(r));
  const view = $('#view');
  view.innerHTML = html;
  typoDom(view);
  fitAmount($('#f-amount'));
  const tab = TAB_OF[r.name];
  $$('#tabbar .tab[data-tab]').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const key = r.name + '/' + (r.arg || '');
  if (key !== LAST_KEY) {
    const changed = LAST_KEY !== null;
    LAST_KEY = key;
    window.scrollTo(0, 0);
    if (r.name === 'ajouter') {
      const a = $('#f-amount');
      if (a) a.focus({ preventScroll: true });
      const kb = $('#kb-proxy');
      if (kb && document.activeElement === kb) kb.blur();
    } else if (changed) {
      const h = $('#view h1');
      if (h) h.focus({ preventScroll: true });
    }
  }
  if (r.name === '') sweepGauge();
}
function softRender() { if (!isFormRoute(route())) render(); }

    const p = $('#cf-pname');
    if (p) p.textContent = CF.name || 'Nom';
  } else if (id === 'c-kw' && CF) CF.kw = t.value;
});
document.addEventListener('change', e => {
  const t = e.target, id = t.id;
  if (id === 'f-date' && F) F.date = t.value || today();
  else if (id === 'f-desc' && F) { F.desc = t.value; aiUpdate(false); }
  else if (id === 's-limit') {
    const c = parseAmount(t.value);
    if (!c || c < 100) { toast('Limite minimale : 1 €.'); t.value = numInput(DB.settings.limit); return; }
    commit(db => { db.settings.limit = c; }, { render: false });
    t.value = numInput(c);
    toast('Limite : ' + money(c) + ' par jour');
  } else if (id === 'dz-from') DZR.from = t.value;
  else if (id === 'dz-to') DZR.to = t.value;
  else if (t.matches && t.matches('input[type="checkbox"][data-day]')) {
    if (t.checked) DZSEL.add(t.dataset.day); else DZSEL.delete(t.dataset.day);
    const b = $('#dz-btn');
    if (b) { b.disabled = DZSEL.size === 0; b.textContent = dzLabel(); }
  } else if (id === 'import-file' && t.files && t.files[0]) importFile(t.files[0]);
});
document.addEventListener('focusout', e => {
  if (e.target.id === 'f-amount' && F) {
    const c = parseAmount(F.amount);
    if (c && c > 0) { F.amount = numInput(c); e.target.value = F.amount; fitAmount(e.target); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'f-amount') { e.preventDefault(); const d = $('#f-desc'); if (d) d.focus(); }
  else if (e.target.id === 'f-desc') { e.preventDefault(); e.target.blur(); }
  else if (e.target.id === 's-limit') e.target.blur();
});

window.addEventListener('hashchange', () => { INTERNAL_NAV = true; render(); });
window.addEventListener('storage', e => { if (e.key === KEY || e.key === null) { DB = readDB(); invalidate(); softRender(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { DB = readDB(); invalidate(); softRender(); } });
window.addEventListener('pageshow', e => { if (e.persisted) { DB = readDB(); invalidate(); softRender(); } });
function scheduleMidnight() {
  const n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
  setTimeout(() => { softRender(); scheduleMidnight(); }, next - n);
}

/* =====================================================================
   14. Démarrage
   ===================================================================== */
function boot() {
  try { localStorage.setItem(KEY + '.test', '1'); localStorage.removeItem(KEY + '.test'); }
  catch (e) { STORAGE_OK = false; }
  DB = readDB();
  $$('[data-icon]').forEach(s => { s.outerHTML = ico(s.dataset.icon, Number(s.dataset.size) || 24); });
  const cap = readCapture();
  if (cap) {
    CAPTURE = cap;
    history.replaceState(null, '', location.pathname + '#/paiement');
  } else if (location.search && /(^|[?&])(amount|montant|merchant)=/i.test(location.search)) {
    history.replaceState(null, '', location.pathname + '#/');
  } else if (!location.hash) {
    history.replaceState(null, '', location.pathname + location.search + '#/');
  }
  render();
  scheduleMidnight();
  if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

window.__sousous = { parseAmount, parseQuery, predict, norm, clean, incomeInfo, monthIncome, version: VERSION, get db() { return DB; } };

boot();
})();
</script>
